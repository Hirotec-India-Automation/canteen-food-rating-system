<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>Canteen Feedback</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
      background: linear-gradient(160deg, #e8f4ff 0%, #f7fbff 60%, #e6f9fb 100%);
      color: #1a2b3c;
    }

    .hidden { display: none !important; }

    /* ---------- Status overlays (kept tiny so they never clutter) ---------- */
    .sync-badge {
      position: fixed; top: 14px; left: 14px;
      width: 34px; height: 34px; border-radius: 50%;
      background: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,.15);
      display: flex; align-items: center; justify-content: center;
      z-index: 30; cursor: pointer;
    }
    .sync-badge .dot { width: 12px; height: 12px; border-radius: 50%; background: #28a745; }
    .sync-badge.offline .dot { background: #dc3545; }
    .sync-badge.pending .dot { background: #ff9800; }
    .sync-badge .spinner {
      display: none; width: 16px; height: 16px;
      border: 2px solid rgba(0,123,255,.25); border-top-color: #007bff;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    .sync-badge.syncing .dot { display: none; }
    .sync-badge.syncing .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .ist-clock {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,.85); padding: 8px 18px; border-radius: 18px;
      font-size: 15px; font-weight: 600; color: #445; box-shadow: 0 2px 6px rgba(0,0,0,.08);
      z-index: 30; white-space: nowrap;
    }

    /* Idle countdown = thin bar, not a text badge */
    #idle-bar {
      position: fixed; top: 0; left: 0; height: 5px; width: 100%;
      background: #ff9800; transform-origin: left; z-index: 40;
      transition: transform 1s linear; display: none;
    }

    #admin-link {
      position: fixed; bottom: 14px; right: 14px; z-index: 30;
      width: 52px; height: 52px; border-radius: 50%;
      background: rgba(255,255,255,.9); box-shadow: 0 2px 8px rgba(0,0,0,.12);
      display: flex; align-items: center; justify-content: center;
      color: #7a8a99; font-size: 22px; text-decoration: none;
    }
    #admin-link:active { background: #dbe9f5; }

    /* ---------- Screens ---------- */
    .screen {
      display: none;
      flex-direction: column;
      width: 100%; max-width: 1100px;
      padding: 70px 24px 90px;
      animation: fadeIn .25s ease;
    }
    .screen.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: none;} }

    h1 {
      font-size: clamp(28px, 4.5vw, 46px);
      text-align: center; color: #123a5c; margin-bottom: 8px; font-weight: 700;
    }
    .subtitle { text-align: center; font-size: clamp(16px, 2vw, 22px); color: #5a6b7c; margin-bottom: 28px; }

    /* ---------- Rating screen ---------- */
    .rating-row {
      display: flex; justify-content: center; align-items: center;
      gap: clamp(10px, 2.5vw, 28px); flex: 1;
    }
    .emoji-btn {
      border: none; background: transparent; cursor: pointer;
      width: clamp(90px, 16vw, 170px); height: clamp(90px, 16vw, 170px);
      border-radius: 50%; padding: 10px;
      transition: transform .15s ease, background-color .15s ease;
    }
    .emoji-btn img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    .emoji-btn:active { transform: scale(1.12); background-color: #cfe6fb; }
    .emoji-btn.picked { transform: scale(1.18); background-color: #007bff; }

    .hint { text-align: center; margin-top: 26px; font-size: clamp(15px, 1.8vw, 20px); color: #7a8a99; }

    /* ---------- Selection screens (liked / reasons) ---------- */
    .list-wrap {
      flex: 1; min-height: 0; overflow-y: auto;
      background: #ffffff; border-radius: 18px;
      box-shadow: 0 6px 18px rgba(20,60,100,.10);
      scrollbar-width: none; -ms-overflow-style: none;
      margin-bottom: 20px;
    }
    .list-wrap::-webkit-scrollbar { display: none; }

    .pick-row {
      display: flex; align-items: center; gap: 20px;
      min-height: 74px; padding: 10px 24px;
      font-size: clamp(20px, 2.6vw, 27px); font-weight: 500;
      border-bottom: 1px solid #eef3f8; cursor: pointer;
      transition: background-color .12s ease;
    }
    .pick-row:active { background-color: #e3f0fd; }
    .pick-row input[type="checkbox"] {
      appearance: none; -webkit-appearance: none;
      width: 40px; height: 40px; flex: 0 0 40px;
      border: 3px solid #b9cbdc; border-radius: 10px;
      cursor: pointer; position: relative; background: #fff;
    }
    .pick-row input[type="checkbox"]:checked { background: #007bff; border-color: #007bff; }
    .pick-row input[type="checkbox"]:checked::after {
      content: "\f00c"; font-family: "Font Awesome 6 Free"; font-weight: 900;
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 24px;
    }
    .pick-row.checked { background-color: #d8ecff; }
    .pick-row span { pointer-events: none; }

    /* Reason grid per item: replaces the cramped table for touch */
    .reason-item { padding: 14px 20px 18px; border-bottom: 2px solid #eef3f8; }
    .reason-item.checked { background: #eaf5ff; }
    .reason-name {
      font-size: clamp(21px, 2.8vw, 28px); font-weight: 700; color: #123a5c; margin-bottom: 12px;
    }
    .reason-chips { display: flex; flex-wrap: wrap; gap: 12px; }
    .chip {
      border: 2px solid #c4d4e3; background: #fff; color: #33475b;
      border-radius: 999px; padding: 14px 26px;
      font-size: clamp(17px, 2vw, 22px); font-weight: 600; cursor: pointer;
      transition: background-color .12s ease, color .12s ease, border-color .12s ease;
      min-height: 56px;
    }
    .chip:active { background: #e3f0fd; }
    .chip.on { background: #007bff; border-color: #007bff; color: #fff; }

    /* ---------- Bottom action bar ---------- */
    .action-bar {
      display: flex; gap: 18px; justify-content: center;
    }
    .btn {
      border: none; border-radius: 16px; cursor: pointer;
      min-height: 76px; padding: 0 44px;
      font-size: clamp(20px, 2.6vw, 28px); font-weight: 700;
      transition: transform .1s ease, background-color .15s ease, opacity .15s ease;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: #007bff; color: #fff; min-width: min(420px, 56%); }
    .btn-primary:active { background: #005bab; }
    .btn-primary:disabled { background: #c9d4de; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: #6a7b8c; border: 3px solid #c9d4de; min-width: 200px; }
    .btn-ghost:active { background: #eef3f8; }

    /* ---------- Thank you ---------- */
    #screen-thanks { align-items: center; justify-content: center; text-align: center; }
    #screen-thanks img { width: clamp(150px, 24vw, 240px); height: auto; margin-bottom: 18px; }
    #thanks-msg { font-size: clamp(30px, 5vw, 52px); font-weight: 700; color: #123a5c; max-width: 800px; }

    .app-footer {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
      font-size: 14px; font-weight: 600; color: #8a99a8; z-index: 20; white-space: nowrap;
      pointer-events: none;
    }
    .app-logo {
      position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%);
      height: 40px; z-index: 20; pointer-events: none;
    }

    @media (max-width: 640px) {
      .screen { padding: 64px 14px 84px; }
      .btn { min-height: 66px; padding: 0 26px; }
      .btn-ghost { min-width: 140px; }
      .app-logo { height: 30px; }
    }
  </style>
<base target="_blank">
</head>
<body>
  <div id="idle-bar"></div>

  <div id="sync-badge" class="sync-badge offline" title="Offline">
    <span class="dot"></span><span class="spinner"></span>
  </div>
  <div id="ist-clock" class="ist-clock"></div>
  <a id="admin-link" href="ratingLogin.html" aria-label="Admin login"><i class="fas fa-user-gear"></i></a>
  <img id="app-logo" src="images/logo.jpg" alt="" class="app-logo">

  <!-- 1. RATING -->
  <section id="screen-rating" class="screen active">
    <h1>How was your meal today?</h1>
    <p class="subtitle">Tap a smiley to rate</p>
    <div class="rating-row" id="rating-row"></div>
    <p class="hint">Your feedback helps us serve you better</p>
  </section>

  <!-- 2. LIKED ITEMS (rating 4-5) -->
  <section id="screen-liked" class="screen">
    <h1 id="liked-title">What did you like?</h1>
    <p class="subtitle">Tap the items you enjoyed</p>
    <div class="list-wrap" id="liked-list"></div>
    <div class="action-bar">
      <button class="btn btn-ghost" id="liked-skip">Skip</button>
      <button class="btn btn-primary" id="liked-submit" disabled>Submit</button>
    </div>
  </section>

  <!-- 3. REASONS (rating 1-3) -->
  <section id="screen-reasons" class="screen">
    <h1>Help us improve</h1>
    <p class="subtitle">Tap the items that need attention</p>
    <div class="list-wrap" id="reason-list"></div>
    <div class="action-bar">
      <button class="btn btn-ghost" id="reasons-skip">Skip</button>
      <button class="btn btn-primary" id="reasons-submit" disabled>Submit</button>
    </div>
  </section>

  <!-- 4. THANK YOU -->
  <section id="screen-thanks" class="screen">
    <img id="thanks-img" src="images/5.png" alt="">
    <h2 id="thanks-msg">Thank you for your feedback!</h2>
  </section>

  <script src="assets/js/supabase-sync.js"></script>
  <script>
    /* =========================================================
       Touch-optimized kiosk flow
       1) Rate with one tap (auto-advances, no Next button)
       2) Rating 4-5 -> "what did you like"   (optional, Skip)
       3) Rating 1-3 -> "what went wrong"     (optional, Skip)
       4) Thank-you, auto-reset
       ========================================================= */

    const IDLE_TIMEOUT_SECONDS = 15;

    let ratingValue = null;
    let idleInterval = null;
    let idleSecondsLeft = IDLE_TIMEOUT_SECONDS;

    const idleBar = document.getElementById('idle-bar');
    const thanksImg = document.getElementById('thanks-img');
    const thanksMsg = document.getElementById('thanks-msg');

    /* ---------- Screen switching ---------- */
    const TIMED_SCREENS = ['screen-liked', 'screen-reasons'];
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.getElementById('app-logo').classList.toggle('hidden', id === 'screen-reasons');
      if (TIMED_SCREENS.includes(id)) startIdle(id); else stopIdle();
    }

    /* ---------- Idle auto-submit ---------- */
    function startIdle(screenId) {
      stopIdle();
      idleSecondsLeft = IDLE_TIMEOUT_SECONDS;
      idleBar.style.display = 'block';
      idleBar.style.transform = 'scaleX(1)';
      idleInterval = setInterval(() => {
        idleSecondsLeft--;
        idleBar.style.transform = `scaleX(${Math.max(idleSecondsLeft, 0) / IDLE_TIMEOUT_SECONDS})`;
        if (idleSecondsLeft <= 0) {
          const timed = screenId;
          stopIdle();
          if (timed === 'screen-liked') {
            document.querySelectorAll('#liked-list input:checked').length
              ? submitLiked() : resetToRating();
          } else {
            document.querySelectorAll('#reason-list .chip.on').length
              ? submitReasons() : resetToRating();
          }
        }
      }, 1000);
    }
    function stopIdle() {
      if (idleInterval) clearInterval(idleInterval);
      idleInterval = null;
      idleBar.style.display = 'none';
    }
    document.addEventListener('click', () => {
      const active = document.querySelector('.screen.active');
      if (active && TIMED_SCREENS.includes(active.id)) startIdle(active.id);
    }, true);

    /* ---------- Rating screen ---------- */
    const ratingRow = document.getElementById('rating-row');
    let advancing = false;
    for (let v = 5; v >= 1; v--) {
      const btn = document.createElement('button');
      btn.className = 'emoji-btn';
      btn.dataset.value = v;
      btn.setAttribute('aria-label', v + ' out of 5');
      btn.innerHTML = `<img src="images/${v}.png" alt="">`;
      btn.addEventListener('click', () => pickRating(v, btn));
      ratingRow.appendChild(btn);
    }
    function pickRating(v, btn) {
      if (advancing) return;
      advancing = true;
      ratingValue = v;
      btn.classList.add('picked');
      setTimeout(() => {
        if (v >= 4) {
          document.getElementById('liked-title').textContent =
            v === 5 ? 'What did you love?' : 'What did you like?';
          showScreen('screen-liked');
        } else {
          showScreen('screen-reasons');
        }
      }, 650);
    }

    /* ---------- Data saving ---------- */
    function appendToLocalStorage(key, data) {
      const existing = JSON.parse(localStorage.getItem(key)) || [];
      existing.push(data);
      localStorage.setItem(key, JSON.stringify(existing));
    }
    function cloudSafe(rows) {
      if (typeof cloudSaveFeedback === 'function') cloudSaveFeedback(rows);
    }
    function saveRatingOnly() {
      const date = new Date().toISOString().split('T')[0];
      appendToLocalStorage('canteenFeedback', { date, rating: ratingValue });
      cloudSafe([{ feedback_date: date, rating: ratingValue, feedback_type: 'rating_only' }]);
    }
    function saveLiked(items) {
      const date = new Date().toISOString().split('T')[0];
      appendToLocalStorage('canteenFeedback', { date, rating: ratingValue, goodFood: items });
      cloudSafe(items.map(food_item => ({
        feedback_date: date, rating: ratingValue, feedback_type: 'good_food', food_item
      })));
    }
    function saveReasons(reasons) {
      const date = new Date().toISOString().split('T')[0];
      appendToLocalStorage('canteenFeedback', { date, rating: ratingValue, reasons });
      cloudSafe(reasons.map(r => ({
        feedback_date: date, rating: ratingValue, feedback_type: 'reason',
        food_item: r.foodItem, reason: r.reason
      })));
    }

    /* ---------- Liked items screen ---------- */
    const likedList = document.getElementById('liked-list');
    const likedSubmit = document.getElementById('liked-submit');
    document.getElementById('liked-skip').addEventListener('click', () => { saveRatingOnly(); showThanks(); });
    likedSubmit.addEventListener('click', submitLiked);
    function submitLiked() {
      const items = Array.from(likedList.querySelectorAll('input:checked')).map(cb => cb.value);
      if (!items.length) { saveRatingOnly(); } else { saveLiked(items); }
      showThanks();
    }

    /* ---------- Reasons screen ---------- */
    const reasonList = document.getElementById('reason-list');
    const reasonsSubmit = document.getElementById('reasons-submit');
    document.getElementById('reasons-skip').addEventListener('click', () => { saveRatingOnly(); showThanks(); });
    reasonsSubmit.addEventListener('click', submitReasons);
    function submitReasons() {
      const picked = [];
      reasonList.querySelectorAll('.reason-item').forEach(item => {
        const food = item.dataset.food;
        item.querySelectorAll('.chip.on').forEach(chip => picked.push({ foodItem: food, reason: chip.dataset.reason }));
      });
      if (!picked.length) { saveRatingOnly(); } else { saveReasons(picked); }
      showThanks();
    }

    /* ---------- Build lists from today's menu ---------- */
    const REASONS = ['Salty', 'Too Spicy', 'Undercooked', 'Overcooked', 'Not Fresh', 'Too Oily'];

    function buildLikedList(items) {
      likedList.innerHTML = '';
      items.forEach((item, i) => {
        const label = document.createElement('label');
        label.className = 'pick-row';
        label.innerHTML = `<input type="checkbox" id="liked-${i}" value="${item}"><span>${item}</span>`;
        const cb = label.querySelector('input');
        cb.addEventListener('change', () => {
          label.classList.toggle('checked', cb.checked);
          likedSubmit.disabled = !likedList.querySelector('input:checked');
        });
        likedList.appendChild(label);
      });
      likedSubmit.disabled = true;
    }

    function buildReasonList(items) {
      reasonList.innerHTML = '';
      items.forEach(item => {
        const wrap = document.createElement('div');
        wrap.className = 'reason-item';
        wrap.dataset.food = item;
        const name = document.createElement('div');
        name.className = 'reason-name';
        name.textContent = item;
        const chips = document.createElement('div');
        chips.className = 'reason-chips';
        REASONS.forEach(r => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'chip';
          chip.dataset.reason = r;
          chip.textContent = r;
          chip.addEventListener('click', () => {
            chip.classList.toggle('on');
            wrap.classList.toggle('checked', !!wrap.querySelector('.chip.on'));
            reasonsSubmit.disabled = !reasonList.querySelector('.chip.on');
          });
          chips.appendChild(chip);
        });
        wrap.appendChild(name);
        wrap.appendChild(chips);
        reasonList.appendChild(wrap);
      });
      reasonsSubmit.disabled = true;
    }

    /* ---------- Thank you + reset ---------- */
    function showThanks() {
      const msgs = {
        5: "Amazing! We're glad you enjoyed it. Thank you!",
        4: "Great! We'll keep it up. Thank you!",
        3: "Thanks! We'll keep improving.",
        2: "Sorry to hear that. We'll work on it. Thank you!",
        1: "We apologize for the experience. Thank you!"
      };
      thanksImg.src = `images/${ratingValue}.png`;
      thanksMsg.textContent = msgs[ratingValue] || 'Thank you for your feedback!';
      showScreen('screen-thanks');
      setTimeout(resetToRating, 3000);
    }

    function resetToRating() {
      stopIdle();
      ratingValue = null;
      advancing = false;
      document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('picked'));
      likedList.querySelectorAll('input:checked').forEach(cb => cb.checked = false);
      likedList.querySelectorAll('.pick-row').forEach(r => r.classList.remove('checked'));
      reasonList.querySelectorAll('.chip.on').forEach(c => c.classList.remove('on'));
      reasonList.querySelectorAll('.reason-item').forEach(r => r.classList.remove('checked'));
      likedSubmit.disabled = true;
      reasonsSubmit.disabled = true;
      showScreen('screen-rating');
    }

    /* ---------- Menu loading (Supabase with offline fallback) ---------- */
    async function getTodayMenuItems() {
      const today = new Date().toISOString().split('T')[0];
      const cache = JSON.parse(localStorage.getItem('dailyMenus')) || {};
      try {
        if (typeof cloudFetchDailyMenu === 'function') {
          const cloud = await cloudFetchDailyMenu(today);
          if (cloud && cloud.length) {
            cache[today] = cloud;
            localStorage.setItem('dailyMenus', JSON.stringify(cache));
            return cloud;
          }
        }
      } catch (e) { /* offline or misconfigured — use cache */ }
      return cache[today] || [];
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const items = await getTodayMenuItems();
      if (items.length) {
        buildLikedList(items);
        buildReasonList(items);
      }
    });

    /* ---------- IST clock ---------- */
    const istClock = document.getElementById('ist-clock');
    const istFmt = new Intl.DateTimeFormat('en-IN', {
      timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: true
    });
    const tickClock = () => istClock.textContent = istFmt.format(new Date());
    tickClock(); setInterval(tickClock, 1000);

    /* ---------- Sync badge (graceful if supabase-sync.js absent) ---------- */
    const syncBadge = document.getElementById('sync-badge');
    function updateSyncBadge(status) {
      const online = status ? status.online : navigator.onLine;
      const pending = status ? status.pending
        : JSON.parse(localStorage.getItem('pendingSupabaseOps') || '[]').length;
      const flushing = status ? status.flushing : false;
      syncBadge.classList.toggle('offline', !online);
      syncBadge.classList.toggle('syncing', online && flushing);
      syncBadge.classList.toggle('pending', online && !flushing && pending > 0);
      syncBadge.title = !online ? 'Offline' + (pending ? ` – ${pending} queued` : '')
        : flushing ? 'Syncing…' : pending ? `${pending} item(s) waiting to sync` : 'Online';
    }
    if (typeof onSyncStatusChange === 'function') onSyncStatusChange(updateSyncBadge);
    window.addEventListener('online', () => updateSyncBadge());
    window.addEventListener('offline', () => updateSyncBadge());
    updateSyncBadge();
    document.addEventListener('contextmenu', e => e.preventDefault());
    syncBadge.addEventListener('click', () => {
      const pending = JSON.parse(localStorage.getItem('pendingSupabaseOps') || '[]').length;
      const lastError = typeof getLastSupabaseError === 'function' ? getLastSupabaseError() : null;
      if (!pending && !lastError) { alert('Everything is synced to Supabase.'); return; }
      let msg = pending + ' item(s) waiting to sync to Supabase.';
      if (lastError) {
        msg += `\n\nLast error (${lastError.at}):\n${lastError.context}\n${lastError.message || ''}`;
        if (lastError.hint) msg += `\nHint: ${lastError.hint}`;
        if (lastError.code) msg += `\nCode: ${lastError.code}`;
      }
      alert(msg);
    });
  </script>
  <div class="app-footer">Built with <i class="fas fa-heart" style="color:#ff2d2d"></i> by <strong>Hirotec Team India</strong></div>
</body>
</html>
