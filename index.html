<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>Hirotec Canteen Feedback</title>
  <style>
    * {
      box-sizing: border-box; margin: 0; padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%; overflow: hidden;
      overscroll-behavior: none; touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
    }
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      min-height: 100%;
    }
    .hidden { display: none !important; }

    /* ── Fixed Overlays ─────────────────────────────────────── */
    .ist-clock {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,.95); padding: 8px 20px; border-radius: 18px;
      font-size: 16px; font-weight: 700; color: #0a2540;
      box-shadow: 0 4px 12px rgba(0,0,0,.15); z-index: 30; white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.6);
    }
    #admin-link {
      position: fixed; bottom: 14px; right: 14px; z-index: 30;
      width: 52px; height: 52px; border-radius: 50%;
      background: rgba(255,255,255,.95); box-shadow: 0 4px 12px rgba(0,0,0,.15);
      display: flex; align-items: center; justify-content: center;
      color: #0a2540; font-size: 22px; text-decoration: none;
    }
    #admin-link:active { background: #dbe9f5; }
    #app-logo {
      position: fixed; top: 10px; right: 14px;
      height: 40px; z-index: 20; pointer-events: none;
    }
    #reload-btn {
      position: fixed; top: 14px; left: 14px; z-index: 30;
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,.95); box-shadow: 0 4px 12px rgba(0,0,0,.15);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #0a2540; font-size: 20px;
      touch-action: manipulation; transition: background .15s ease;
    }
    #reload-btn:active { background: #dbe9f5; }

    /* Back Button on Feedback Screens */
    #back-btn {
      position: fixed; top: 14px; left: 14px; z-index: 60;
      background: #ffffff; border: none; cursor: pointer;
      padding: 10px 20px; border-radius: 999px;
      box-shadow: 0 4px 14px rgba(0,0,0,.2);
      font-size: 16px; font-weight: 800; color: #0056b3;
      display: flex; align-items: center; gap: 8px;
      touch-action: manipulation; transition: background .15s, transform .15s;
    }
    #back-btn:active { background: #e6f0fa; transform: scale(.96); }

    #feedback-count-wrap {
      position: fixed; bottom: 14px; left: 14px; z-index: 30;
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,.95); border-radius: 999px;
      padding: 6px 16px 6px 12px;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
      font-size: 14px; color: #0a2540; font-weight: 700; white-space: nowrap;
    }

    /* ── Main Rating Screen (Smileys Card) ───────── */
    #screen-rating {
      background: #ffffff;
      box-shadow: 0 16px 40px rgba(0, 30, 70, 0.25);
      border-radius: 24px;
      padding: 2vh 2vw;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      width: 94vw; height: 90vh;
      position: relative; z-index: 10;
    }
    .rating-header {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; text-align: center;
    }

    /* Prominent Middle Meal Badge with High Contrast Text */
    #meal-badge {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      background: #0066cc; color: #ffffff; border-radius: 999px;
      padding: 10px 32px; font-size: clamp(22px, 3.5vw, 36px); font-weight: 800;
      margin-bottom: 12px; box-shadow: 0 4px 14px rgba(0,102,204,.3);
    }
    #screen-rating h1 {
      font-size: clamp(32px, 5vw, 56px);
      color: #0a2540; font-weight: 800; text-align: center; margin-bottom: 4px;
    }
    #screen-rating .subtitle {
      font-size: clamp(18px, 2.8vw, 30px);
      color: #2c4e6e; text-align: center; margin-bottom: 1vh; font-weight: 700;
    }

    .rating-row {
      display: flex; flex-wrap: nowrap;
      justify-content: center; align-items: center;
      gap: clamp(10px, 3vw, 30px);
      width: 100%;
      flex: 1;
    }
    
    /* ── LARGER SMILEY BUTTONS ── */
    .emoji-btn {
      border: none; background: transparent; cursor: pointer;
      width: clamp(220px, 52vh, 460px);
      height: clamp(220px, 52vh, 460px);
      border-radius: 50%; padding: 12px;
      transition: transform .15s ease, background-color .15s ease;
      touch-action: manipulation;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .emoji-btn img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    .emoji-btn:active { transform: scale(1.06); background-color: #cfe6fb; }
    .emoji-btn.picked { transform: scale(1.10); background-color: #0066cc; }
    
    #screen-rating .hint {
      font-size: clamp(16px, 2.2vw, 24px); color: #4a6572; text-align: center; font-weight: 700;
    }

    /* ── Sub-screens (Liked & Horizontal Row Reason/Menu) ────── */
    .sel-screen {
      display: none; flex-direction: column;
      width: 100%; height: 100%;
      padding: 68px 120px 16px;
      animation: fadeIn .22s ease;
      position: relative; z-index: 11;
    }
    .sel-screen.active { display: flex; }
    .sel-screen h1 {
      font-size: clamp(24px, 3.8vw, 40px);
      color: #ffffff; font-weight: 800; text-align: center; margin-bottom: 4px;
      text-shadow: 0 2px 6px rgba(0,20,50,0.4);
    }
    .sel-screen .subtitle {
      font-size: clamp(15px, 2.2vw, 22px);
      color: #f0f8ff; text-align: center; margin-bottom: 14px; font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,20,50,0.3);
    }

    .sel-card {
      background: #ffffff; border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0,40,90,.2);
      padding: 20px;
      flex: 1; min-height: 0;
      overflow-y: auto;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── WORD CLOUD LAYOUT ── */
    #liked-grid {
      display: flex; flex-wrap: wrap;
      gap: 16px 20px; align-items: center; justify-content: center;
      width: 100%; height: 100%;
      padding: 10px;
    }
    .food-chip {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 2px solid #80bfff; background: #e8f4ff; color: #0a2b4a;
      border-radius: 999px; padding: 12px 24px;
      font-weight: 800; cursor: pointer;
      transition: transform .15s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease;
      touch-action: manipulation;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(0,60,130,.12);
      flex: 0 0 auto;
    }

    .word-size-lg { font-size: clamp(18px, 2.2vw, 28px); padding: 16px 30px; }
    .word-size-md { font-size: clamp(15px, 1.8vw, 22px); padding: 12px 24px; }
    .word-size-sm { font-size: clamp(13px, 1.4vw, 18px); padding: 10px 18px; }

    .tilt-left  { transform: rotate(-2deg); }
    .tilt-right { transform: rotate(2deg); }
    .tilt-none  { transform: rotate(0deg); }

    .food-chip:active { transform: scale(.95) !important; }
    .food-chip .fc-check {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid #0a2b4a; background: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 11px; color: transparent;
      transition: background .12s, border-color .12s, color .12s;
    }
    .food-chip.on {
      background: #0066cc; border-color: #004080; color: #ffffff;
      transform: scale(1.08) rotate(0deg) !important;
      box-shadow: 0 6px 18px rgba(0,102,204,.4);
    }
    .food-chip.on .fc-check { background: rgba(255,255,255,.3); border-color: transparent; color: #ffffff; }

    /* ── HORIZONTAL ROW FORMAT FOR REASONS ── */
    #reason-grid {
      display: flex; flex-direction: column;
      gap: 12px; width: 100%; height: 100%;
      overflow-y: auto; padding-right: 6px;
    }
    .reason-row {
      display: flex; flex-direction: row; align-items: center;
      justify-content: space-between;
      background: #f2f7fc; border-radius: 14px;
      border: 2px solid #d0e2f2; padding: 12px 18px;
      gap: 16px; width: 100%; flex-shrink: 0;
      transition: background .15s, border-color .15s;
    }
    .reason-row.on { border-color: #0066cc; background: #e3f0fc; }
    
    .reason-row-name {
      font-size: clamp(15px, 1.7vw, 19px); font-weight: 800;
      color: #0a2540; white-space: nowrap; flex-shrink: 0;
    }

    .reason-chips {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: flex-end; align-items: center; flex: 1;
    }
    .r-chip {
      border: 2px solid #99c2ec; background: #ffffff; color: #1e293b;
      border-radius: 999px; padding: 6px 14px;
      font-size: clamp(12px, 1.3vw, 14px); font-weight: 700; cursor: pointer;
      transition: background .12s, color .12s, border-color .12s;
      touch-action: manipulation; white-space: nowrap;
    }
    .r-chip:active { background: #d0e4ff; }
    .r-chip.on { background: #0066cc; border-color: #004080; color: #ffffff; }

    /* ── Side Action Controls ──────────────────────────────── */
    #global-skip, #submit-wrap {
      position: fixed; top: 50%; transform: translateY(-50%);
      z-index: 50; display: none;
    }
    #global-skip { left: 0; }
    #submit-wrap  { right: 0; }
    #global-skip.visible, #submit-wrap.visible { display: flex; }

    #global-skip {
      flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; width: 100px; min-height: 110px;
      background: #ffffff; border: none;
      border-radius: 0 18px 18px 0;
      box-shadow: 4px 0 14px rgba(0,0,0,.18);
      cursor: pointer; font-size: 18px; font-weight: 800; color: #33475b;
      touch-action: manipulation; padding: 0 8px;
    }
    #global-skip:active { background: #e6eff8; transform: translateY(-50%) scale(.96); }
    .skip-cd { font-size: 26px; font-weight: 900; color: #d97706; line-height: 1; }

    #submit-wrap {
      align-items: center; justify-content: center;
      width: 120px; min-height: 120px;
    }
    #global-submit {
      position: relative; width: 108px; height: 108px;
      border: none; border-radius: 50%;
      background: #0066cc; color: #ffffff;
      font-size: 17px; font-weight: 800; cursor: pointer;
      touch-action: manipulation;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 2px;
      box-shadow: -4px 0 16px rgba(0,0,0,.22);
    }
    #global-submit:active { background: #004080; transform: scale(.96); }
    .submit-cd { font-size: 13px; font-weight: 700; opacity: .9; line-height: 1; }
    .submit-ring {
      position: absolute; inset: -6px;
      width: calc(100% + 12px); height: calc(100% + 12px);
      transform: rotate(-90deg); pointer-events: none;
    }
    .submit-ring-track { fill: none; stroke: rgba(255,255,255,.25); stroke-width: 5; }
    .submit-ring-fill  {
      fill: none; stroke: #ffffff; stroke-width: 5; stroke-linecap: round;
      transition: stroke-dashoffset .95s linear;
    }

    /* ── Thank You Screen ───────────────────────────────────── */
    #screen-thanks {
      display: none; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      position: relative; z-index: 11;
    }
    #screen-thanks.active { display: flex; }
    #screen-thanks img { width: clamp(140px, 22vw, 220px); height: auto; margin-bottom: 20px; }
    #thanks-msg {
      font-size: clamp(26px, 4.8vw, 48px); font-weight: 800;
      color: #ffffff; max-width: 820px;
      text-shadow: 0 2px 8px rgba(0,20,50,0.4);
    }

    /* ── ENLARGED APP FOOTER ───────────────────────────────── */
    .app-footer {
      position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
      font-size: clamp(18px, 2.5vw, 26px); font-weight: 800; color: #000000;
      z-index: 20; white-space: nowrap; pointer-events: none;
      text-shadow: 0 1px 4px rgba(255,255,255,0.9);
    }
    .app-footer svg {
      width: clamp(20px, 2.8vw, 28px);
      height: clamp(20px, 2.8vw, 28px);
      vertical-align: middle; display: inline-block; margin: 0 3px;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    @media (max-width: 768px) {
      .emoji-btn { width: clamp(130px, 30vh, 240px); height: clamp(130px, 30vh, 240px); }
      .reason-row { flex-direction: column; align-items: flex-start; gap: 10px; }
      .reason-chips { justify-content: flex-start; width: 100%; }
      .sel-screen { padding: 58px 88px 12px; }
      #global-skip { width: 80px; min-height: 90px; font-size: 15px; }
      .skip-cd { font-size: 20px; }
      #global-submit { width: 86px; height: 86px; font-size: 14px; }
      #submit-wrap { width: 96px; min-height: 96px; }
    }
  </style>
</head>
<body>
  <div id="ist-clock" class="ist-clock"></div>
  <button id="reload-btn" onclick="location.reload()" aria-label="Reload page">
    <i class="fas fa-rotate-right"></i>
  </button>
  
  <!-- Back Button on Feedback Screens -->
  <button id="back-btn" class="hidden" onclick="resetToRating()" aria-label="Back to rating screen">
    <i class="fas fa-arrow-left"></i> Back
  </button>

  <img id="app-logo" src="images/logo.jpg" alt="Hirotec logo">
  <a id="admin-link" href="ratingLogin.html" aria-label="Admin login"><i class="fas fa-user-gear"></i></a>
  <div id="feedback-count-wrap">
    <i class="fas fa-comment-dots" style="color:#0066cc;font-size:16px;"></i>
    Today:&nbsp;<span id="feedback-count" style="font-size:18px;font-weight:800;color:#0066cc;">0</span>
  </div>

  <!-- 1. MAIN RATING SCREEN -->
  <div id="screen-rating">
    <div class="rating-header">
      <div id="meal-badge">🍱 <span id="meal-badge-text">Lunch</span></div>
      <h1>How was your meal today?</h1>
      <p class="subtitle">Tap a smiley to rate</p>
    </div>
    <div class="rating-row" id="rating-row"></div>
    <p class="hint">Your feedback helps us serve you better</p>
  </div>

  <!-- 2. LIKED MENU SCREEN (Word Cloud Layout) -->
  <div id="screen-liked" class="sel-screen">
    <h1 id="liked-title">What did you love?</h1>
    <p class="subtitle">Tap the items you enjoyed</p>
    <div class="sel-card">
      <div id="liked-grid"></div>
    </div>
  </div>

  <!-- 3. HELP US IMPROVE SCREEN -->
  <div id="screen-reasons" class="sel-screen">
    <h1>Help us improve</h1>
    <p class="subtitle">Select the menu item and feedback reason in each row</p>
    <div class="sel-card">
      <div id="reason-grid"></div>
    </div>
  </div>

  <!-- 4. THANK YOU SCREEN -->
  <div id="screen-thanks">
    <img id="thanks-img" src="images/5.png" alt="">
    <p id="thanks-msg">Thank you for your feedback!</p>
  </div>

  <!-- Side buttons for menu selection screens -->
  <button id="global-skip" aria-label="Skip">
    <span class="skip-cd" id="skip-cd">15</span>Skip
  </button>
  <div id="submit-wrap">
    <button id="global-submit" aria-label="Submit">
      Submit<span class="submit-cd" id="submit-cd">15s</span>
    </button>
    <svg class="submit-ring" viewBox="0 0 108 108" aria-hidden="true">
      <circle class="submit-ring-track" cx="54" cy="54" r="48"/>
      <circle class="submit-ring-fill"  cx="54" cy="54" r="48" stroke-dasharray="301.6" stroke-dashoffset="301.6" id="ring-fill"/>
    </svg>
  </div>

  <script src="assets/js/supabase-sync.js"></script>
  <script>
    const IDLE_SECS   = 15;
    const RING_CIRC   = 301.6;
    const REASONS_LIST = ['Salty', 'Too Spicy', 'Undercooked', 'Overcooked', 'Not Fresh', 'Too Oily'];

    let ratingValue   = null;
    let advancing     = false;
    let currentScreen = null;
    let idleInterval  = null;
    let idleSecsLeft  = IDLE_SECS;
    let todayCount    = 0;
    let completionAudioContext = null;

    const screenRating  = document.getElementById('screen-rating');
    const screenLiked   = document.getElementById('screen-liked');
    const screenReasons = document.getElementById('screen-reasons');
    const screenThanks  = document.getElementById('screen-thanks');
    const thanksImg     = document.getElementById('thanks-img');
    const thanksMsg     = document.getElementById('thanks-msg');
    const adminLink     = document.getElementById('admin-link');
    const reloadBtn     = document.getElementById('reload-btn');
    const backBtn       = document.getElementById('back-btn');
    const likedGrid     = document.getElementById('liked-grid');
    const reasonGrid    = document.getElementById('reason-grid');
    const globalSkip    = document.getElementById('global-skip');
    const submitWrap    = document.getElementById('submit-wrap');
    const globalSubmit  = document.getElementById('global-submit');
    const skipCd        = document.getElementById('skip-cd');
    const submitCd      = document.getElementById('submit-cd');
    const ringFill      = document.getElementById('ring-fill');
    const feedbackCountEl = document.getElementById('feedback-count');

    const TIMED = ['screen-liked', 'screen-reasons'];

    function getISTDate() {
      return new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit'
      }).format(new Date());
    }

    function getCurrentMealType() {
      const parts = new Intl.DateTimeFormat('en-IN', {
        timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: false
      }).formatToParts(new Date());
      const h = parseInt(parts.find(p => p.type === 'hour').value);
      const m = parseInt(parts.find(p => p.type === 'minute').value);
      return (h * 60 + m) >= 1110 ? 'dinner' : 'lunch';
    }

    function showScreen(id) {
      [screenRating, screenLiked, screenReasons, screenThanks].forEach(el => {
        el.classList.remove('active');
        if (el.id === 'screen-rating') el.classList.toggle('hidden', id !== 'screen-rating');
      });
      if (id !== 'screen-rating') document.getElementById(id).classList.add('active');

      adminLink.classList.toggle('hidden', TIMED.includes(id));
      document.getElementById('app-logo').classList.toggle('hidden', id === 'screen-reasons');

      const timed = TIMED.includes(id);
      reloadBtn.classList.toggle('hidden', timed);
      backBtn.classList.toggle('hidden', !timed);
      globalSkip.classList.toggle('visible', timed);
      submitWrap.classList.toggle('visible', timed);
      
      if (timed) { currentScreen = id; startIdle(id); }
      else        { stopIdle(); currentScreen = null; }
    }

    function updateTimerUI(secs) {
      skipCd.textContent   = secs;
      submitCd.textContent = secs + 's';
      ringFill.style.strokeDashoffset = RING_CIRC * (secs / IDLE_SECS);
    }
    function startIdle(screenId) {
      stopIdle(); idleSecsLeft = IDLE_SECS; updateTimerUI(idleSecsLeft);
      idleInterval = setInterval(() => {
        idleSecsLeft = Math.max(0, idleSecsLeft - 1);
        updateTimerUI(idleSecsLeft);
        if (idleSecsLeft <= 0) {
          stopIdle();
          screenId === 'screen-liked' ? submitLiked() : submitReasons();
        }
      }, 1000);
    }
    function stopIdle() { clearInterval(idleInterval); idleInterval = null; }
    document.addEventListener('pointerdown', () => { if (currentScreen) startIdle(currentScreen); }, true);

    /* ── Render Smileys on Main Screen (Loved it (5), Good (3), Bad (1)) ── */
    const ratingRow = document.getElementById('rating-row');
    const SMILEYS = [
      { v: 5, label: 'Loved it' },
      { v: 3, label: 'Good' },
      { v: 1, label: 'Bad' }
    ];
    SMILEYS.forEach(({ v, label }) => {
      const btn = document.createElement('button');
      btn.className = 'emoji-btn';
      btn.setAttribute('aria-label', label);
      btn.innerHTML = `<img src="images/${v}.png" alt="${label}">`;
      btn.addEventListener('click', () => pickRating(v, btn));
      ratingRow.appendChild(btn);
    });

    function pickRating(v, btn) {
      if (advancing) return;
      advancing = true; ratingValue = v;
      primeAudio(); btn.classList.add('picked');
      setTimeout(() => {
        if (v === 5) {
          document.getElementById('liked-title').textContent = 'What did you love?';
          showScreen('screen-liked');
        } else if (v === 1) {
          showScreen('screen-reasons');
        } else {
          saveRatingOnly(); showThanks();
        }
      }, 400);
    }

    globalSkip.addEventListener('click', () => {
      stopIdle(); saveRatingOnly(); showThanks();
    });
    globalSubmit.addEventListener('click', () => {
      stopIdle();
      currentScreen === 'screen-liked' ? submitLiked() : submitReasons();
    });

    function appendLocal(key, data) {
      const arr = JSON.parse(localStorage.getItem(key) || '[]');
      arr.push(data); localStorage.setItem(key, JSON.stringify(arr));
    }
    function cloudSafe(rows) {
      if (typeof cloudSaveFeedback === 'function') cloudSaveFeedback(rows);
    }
    function saveRatingOnly() {
      const date = getISTDate();
      appendLocal('canteenFeedback', { date, rating: ratingValue });
      cloudSafe([{ feedback_date: date, rating: ratingValue, feedback_type: 'rating_only' }]);
    }
    function saveLiked(items) {
      const date = getISTDate();
      appendLocal('canteenFeedback', { date, rating: ratingValue, goodFood: items });
      cloudSafe(items.map(food_item => ({
        feedback_date: date, rating: ratingValue, feedback_type: 'good_food', food_item
      })));
    }
    function saveReasons(reasons) {
      const date = getISTDate();
      appendLocal('canteenFeedback', { date, rating: ratingValue, reasons });
      cloudSafe(reasons.map(r => ({
        feedback_date: date, rating: ratingValue, feedback_type: 'reason',
        food_item: r.foodItem, reason: r.reason
      })));
    }

    function submitLiked() {
      const items = [...likedGrid.querySelectorAll('.food-chip.on')].map(c => c.dataset.item);
      items.length ? saveLiked(items) : saveRatingOnly();
      showThanks();
    }
    function submitReasons() {
      const picked = [];
      reasonGrid.querySelectorAll('.reason-row').forEach(row => {
        row.querySelectorAll('.r-chip.on').forEach(chip =>
          picked.push({ foodItem: row.dataset.food, reason: chip.dataset.reason }));
      });
      picked.length ? saveReasons(picked) : saveRatingOnly();
      showThanks();
    }

    /* ── Render Liked Items (Word Cloud Grid) ──────────────────── */
    function buildLikedGrid(items) {
      likedGrid.innerHTML = '';
      const sizes = ['word-size-lg', 'word-size-md', 'word-size-sm'];
      const tilts = ['tilt-left', 'tilt-right', 'tilt-none'];

      items.forEach((item, idx) => {
        const chip = document.createElement('button');
        chip.type = 'button';
        
        const sizeClass = sizes[idx % sizes.length];
        const tiltClass = tilts[idx % tilts.length];
        
        chip.className = `food-chip ${sizeClass} ${tiltClass}`;
        chip.dataset.item = item;
        chip.innerHTML = `<span class="fc-check"><i class="fas fa-check"></i></span>${item}`;
        chip.addEventListener('click', () => chip.classList.toggle('on'));
        likedGrid.appendChild(chip);
      });
    }

    /* ── Render Menu Items & Feedback Reasons in Horizontal Rows ─── */
    function buildReasonGrid(items) {
      reasonGrid.innerHTML = '';
      items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'reason-row'; row.dataset.food = item;
        
        const name = document.createElement('div');
        name.className = 'reason-row-name'; name.textContent = item;
        
        const chips = document.createElement('div');
        chips.className = 'reason-chips';
        REASONS_LIST.forEach(r => {
          const chip = document.createElement('button');
          chip.type = 'button'; chip.className = 'r-chip';
          chip.dataset.reason = r; chip.textContent = r;
          chip.addEventListener('click', () => {
            chip.classList.toggle('on');
            row.classList.toggle('on', !!row.querySelector('.r-chip.on'));
          });
          chips.appendChild(chip);
        });
        row.appendChild(name); row.appendChild(chips);
        reasonGrid.appendChild(row);
      });
    }

    function primeAudio() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!completionAudioContext) completionAudioContext = new Ctx();
      if (completionAudioContext.state === 'suspended') completionAudioContext.resume();
    }
    function playSound() {
      primeAudio();
      const ctx = completionAudioContext; if (!ctx) return;
      const now = ctx.currentTime;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
      gain.connect(ctx.destination);
      [659.25, 783.99].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        osc.type = 'sine'; osc.frequency.value = freq;
        osc.connect(gain);
        osc.start(now + i * 0.12); osc.stop(now + 0.5);
      });
    }

    function showThanks() {
      const msgs = {
        5: "Amazing! We're glad you enjoyed it. Thank you!",
        3: "Thanks! We'll keep improving.",
        1: "We apologize for the experience. We'll work on it. Thank you!"
      };
      thanksImg.src = `images/${ratingValue === 1 ? 2 : ratingValue}.png`;
      thanksMsg.textContent = msgs[ratingValue] || 'Thank you for your feedback!';
      playSound();
      incrementFeedbackCount();
      showScreen('screen-thanks');
      setTimeout(resetToRating, 3000);
    }

    function resetToRating() {
      stopIdle(); ratingValue = null; advancing = false; currentScreen = null;
      document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('picked'));
      likedGrid.querySelectorAll('.food-chip.on').forEach(c => c.classList.remove('on'));
      reasonGrid.querySelectorAll('.r-chip.on').forEach(c => c.classList.remove('on'));
      reasonGrid.querySelectorAll('.reason-row.on').forEach(r => r.classList.remove('on'));
      showScreen('screen-rating');
    }

    async function getTodayMenuItems() {
      const today = getISTDate();
      const meal = getCurrentMealType();
      const cacheKey = `${today}_${meal}`;
      const cache = JSON.parse(localStorage.getItem('dailyMenus') || '{}');

      const badge = document.getElementById('meal-badge-text');
      if (badge) badge.textContent = meal.charAt(0).toUpperCase() + meal.slice(1);

      try {
        if (typeof cloudFetchDailyMenu === 'function') {
          const cloud = await cloudFetchDailyMenu(today, meal);
          if (cloud && cloud.length) {
            cache[cacheKey] = cloud;
            localStorage.setItem('dailyMenus', JSON.stringify(cache));
            return cloud;
          }
        }
      } catch (e) {}
      return cache[cacheKey] || [];
    }

    function incrementFeedbackCount() { todayCount++; feedbackCountEl.textContent = todayCount; }
    function initFeedbackCount() {
      const today = getISTDate();
      const local = JSON.parse(localStorage.getItem('canteenFeedback') || '[]');
      todayCount = local.filter(e => e.date === today).length;
      feedbackCountEl.textContent = todayCount;
      if (typeof cloudFetchFeedback === 'function') {
        cloudFetchFeedback().then(rows => {
          if (!rows) return;
          const cloud = rows.filter(r => r.feedback_date === today).length;
          if (cloud > todayCount) { todayCount = cloud; feedbackCountEl.textContent = todayCount; }
        }).catch(() => {});
      }
    }

    const istClock = document.getElementById('ist-clock');
    const istFmt = new Intl.DateTimeFormat('en-IN', {
      timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: true
    });
    const tickClock = () => istClock.textContent = istFmt.format(new Date());
    tickClock(); setInterval(tickClock, 1000);

    document.addEventListener('contextmenu', e => e.preventDefault());

    document.addEventListener('DOMContentLoaded', async () => {
      initFeedbackCount();
      const items = await getTodayMenuItems();
      if (items.length) {
        buildLikedGrid(items);
        buildReasonGrid(items);
      }
    });
  </script>
