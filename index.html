<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>Hirotec Canteen Feedback</title>
  <style>
    * {
      box-sizing: border-box; margin: 0; padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%; overflow: hidden;
      overscroll-behavior: none; touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
    }
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: #000;
    }
    .hidden { display: none !important; }

    /* ---------- Fixed overlays ---------- */
    .ist-clock {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,.85); padding: 8px 18px; border-radius: 18px;
      font-size: 15px; font-weight: 600; color: #445;
      box-shadow: 0 2px 6px rgba(0,0,0,.08); z-index: 30; white-space: nowrap;
    }
    #admin-link {
      position: fixed; bottom: 14px; right: 14px; z-index: 30;
      width: 52px; height: 52px; border-radius: 50%;
      background: rgba(255,255,255,.9); box-shadow: 0 2px 8px rgba(0,0,0,.12);
      display: flex; align-items: center; justify-content: center;
      color: #7a8a99; font-size: 22px; text-decoration: none;
    }
    #admin-link:active { background: #dbe9f5; }
    #app-logo {
      position: fixed; top: 10px; right: 14px;
      height: 40px; z-index: 20; pointer-events: none;
    }
    #reload-btn {
      position: fixed; top: 14px; left: 14px; z-index: 30;
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,.9); box-shadow: 0 2px 8px rgba(0,0,0,.12);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #7a8a99; font-size: 20px;
      touch-action: manipulation; transition: background .15s ease;
    }
    #reload-btn:active { background: #dbe9f5; }
    #feedback-count-wrap {
      position: fixed; bottom: 14px; left: 14px; z-index: 30;
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,.92); border-radius: 999px;
      padding: 6px 14px 6px 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      font-size: 13px; color: #5a6b7c; font-weight: 600; white-space: nowrap;
    }

    /* ---------- Rating card ---------- */
    .rating-card {
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 12px 32px rgba(20,60,100,.22);
      padding: 40px 48px 32px;
      display: flex; flex-direction: column; align-items: center;
      gap: 0;
      max-width: 95vw;
    }
    .rating-card h1 {
      font-size: clamp(24px, 4vw, 42px);
      color: #123a5c; font-weight: 700; text-align: center; margin-bottom: 6px;
    }
    .rating-card .subtitle {
      font-size: clamp(15px, 2vw, 20px);
      color: #5a6b7c; text-align: center; margin-bottom: 32px;
    }
    .rating-row {
      display: flex; flex-wrap: nowrap;
      justify-content: center; align-items: center;
      gap: clamp(16px, 4vw, 48px);
      margin-bottom: 28px;
    }
    .emoji-btn {
      border: none; background: transparent; cursor: pointer;
      width: clamp(100px, 26vw, 220px);
      height: clamp(100px, 26vw, 220px);
      border-radius: 50%; padding: 12px;
      transition: transform .15s ease, background-color .15s ease;
      touch-action: manipulation;
    }
    .emoji-btn img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    .emoji-btn:active { transform: scale(1.1); background-color: #cfe6fb; }
    .emoji-btn.picked { transform: scale(1.18); background-color: #007bff; }
    .rating-card .hint {
      font-size: clamp(14px, 1.6vw, 18px); color: #7a8a99; text-align: center; margin-bottom: 0;
    }

    /* ---------- Thank you ---------- */
    #screen-thanks {
      display: none; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
    }
    #screen-thanks.active { display: flex; }
    #screen-thanks img { width: clamp(140px, 22vw, 220px); height: auto; margin-bottom: 20px; }
    #thanks-msg { font-size: clamp(26px, 4.5vw, 48px); font-weight: 700; color: #fff; max-width: 800px; }

    .app-footer {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
      font-size: 16px; font-weight: 600; color: #000; z-index: 20;
      white-space: nowrap; pointer-events: none;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .rating-card, #screen-thanks { animation: fadeIn .25s ease; }

    @media (max-width: 640px) {
      .rating-card { padding: 28px 20px 24px; }
      .rating-card .subtitle { margin-bottom: 20px; }
      .rating-row { gap: clamp(8px, 2vw, 20px); margin-bottom: 18px; }
      #app-logo { height: 32px; }
    }
  </style>
</head>
<body>
  <div id="ist-clock" class="ist-clock"></div>
  <button id="reload-btn" onclick="location.reload()" aria-label="Reload page">
    <i class="fas fa-rotate-right"></i>
  </button>
  <img id="app-logo" src="images/logo.jpg" alt="Hirotec logo">
  <a id="admin-link" href="ratingLogin.html" aria-label="Admin login"><i class="fas fa-user-gear"></i></a>
  <div id="feedback-count-wrap">
    <i class="fas fa-comment-dots" style="color:#007bff;font-size:16px;"></i>
    Today:&nbsp;<span id="feedback-count" style="font-size:18px;font-weight:800;color:#007bff;">0</span>
  </div>

  <!-- Rating screen -->
  <div id="screen-rating" class="rating-card">
    <h1>How was your meal today?</h1>
    <p class="subtitle">Tap a smiley to rate</p>
    <div class="rating-row" id="rating-row"></div>
    <p class="hint">Your feedback helps us serve you better</p>
  </div>

  <!-- Thank you screen -->
  <div id="screen-thanks">
    <img id="thanks-img" src="images/5.png" alt="">
    <p id="thanks-msg">Thank you for your feedback!</p>
  </div>

  <script src="assets/js/supabase-sync.js"></script>
  <script>
    /* =========================================================
       Simple 3-smiley main branch
       — Tap a smiley → save → thank you → auto reset after 3 s
       ========================================================= */

    // Always use IST date — toISOString() is UTC and flips at 18:30 IST
    function getISTDate() {
      return new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit'
      }).format(new Date());
    }

    let ratingValue = null;
    let advancing   = false;
    let completionAudioContext = null;

    const ratingCard  = document.getElementById('screen-rating');
    const screenThanks = document.getElementById('screen-thanks');
    const thanksImg   = document.getElementById('thanks-img');
    const thanksMsg   = document.getElementById('thanks-msg');
    const adminLink   = document.getElementById('admin-link');
    const feedbackCountEl = document.getElementById('feedback-count');
    let todayCount = 0;

    /* ---------- Build 3 smileys: bad (1), neutral (3), good (5) ---------- */
    const ratingRow = document.getElementById('rating-row');
    const SMILEYS = [
      { v: 1, label: 'Bad'     },
      { v: 3, label: 'Neutral' },
      { v: 5, label: 'Good'    }
    ];
    SMILEYS.forEach(({ v, label }) => {
      const btn = document.createElement('button');
      btn.className = 'emoji-btn';
      btn.setAttribute('aria-label', label);
      btn.innerHTML = `<img src="images/${v}.png" alt="${label}">`;
      btn.addEventListener('click', () => pickRating(v, btn));
      ratingRow.appendChild(btn);
    });

    function pickRating(v, btn) {
      if (advancing) return;
      advancing    = true;
      ratingValue  = v;
      primeAudio();
      btn.classList.add('picked');
      setTimeout(() => {
        saveFeedback();
        showThanks();
      }, 500);
    }

    /* ---------- Save ---------- */
    function saveFeedback() {
      const date = getISTDate();
      const existing = JSON.parse(localStorage.getItem('canteenFeedback') || '[]');
      existing.push({ date, rating: ratingValue });
      localStorage.setItem('canteenFeedback', JSON.stringify(existing));
      if (typeof cloudSaveFeedback === 'function') {
        cloudSaveFeedback([{ feedback_date: date, rating: ratingValue, feedback_type: 'rating_only' }]);
      }
    }

    /* ---------- Thank you + reset ---------- */
    function primeAudio() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!completionAudioContext) completionAudioContext = new Ctx();
      if (completionAudioContext.state === 'suspended') completionAudioContext.resume();
    }

    function playSound() {
      primeAudio();
      const ctx = completionAudioContext;
      if (!ctx) return;
      const now = ctx.currentTime;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
      gain.connect(ctx.destination);
      [659.25, 783.99].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        osc.type = 'sine'; osc.frequency.value = freq;
        osc.connect(gain);
        osc.start(now + i * 0.12); osc.stop(now + 0.5);
      });
    }

    function showThanks() {
      const msgs = {
        5: "Amazing! We're glad you enjoyed it. Thank you!",
        3: "Thanks! We'll keep improving.",
        1: "We apologize for the experience. We'll work on it. Thank you!"
      };
      thanksImg.src = `images/${ratingValue === 1 ? 2 : ratingValue}.png`;
      thanksMsg.textContent = msgs[ratingValue] || 'Thank you for your feedback!';
      playSound();
      incrementFeedbackCount();
      ratingCard.classList.add('hidden');
      adminLink.classList.add('hidden');
      screenThanks.classList.add('active');
      setTimeout(resetToRating, 3000);
    }

    function resetToRating() {
      ratingValue = null; advancing = false;
      document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('picked'));
      screenThanks.classList.remove('active');
      ratingCard.classList.remove('hidden');
      adminLink.classList.remove('hidden');
    }

    /* ---------- Feedback count ---------- */
    function incrementFeedbackCount() {
      todayCount++;
      feedbackCountEl.textContent = todayCount;
    }

    function initFeedbackCount() {
      const today = getISTDate();
      const local = JSON.parse(localStorage.getItem('canteenFeedback') || '[]');
      todayCount = local.filter(e => e.date === today).length;
      feedbackCountEl.textContent = todayCount;
      if (typeof cloudFetchFeedback === 'function') {
        cloudFetchFeedback().then(rows => {
          if (!rows) return;
          const cloud = rows.filter(r => r.feedback_date === today).length;
          if (cloud > todayCount) { todayCount = cloud; feedbackCountEl.textContent = todayCount; }
        }).catch(() => {});
      }
    }

    /* ---------- IST clock ---------- */
    const istClock = document.getElementById('ist-clock');
    const istFmt = new Intl.DateTimeFormat('en-IN', {
      timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: true
    });
    const tickClock = () => istClock.textContent = istFmt.format(new Date());
    tickClock(); setInterval(tickClock, 1000);

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('DOMContentLoaded', initFeedbackCount);
  </script>

  <div class="app-footer">Built with <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" style="vertical-align:middle;display:inline-block;margin:0 2px"><path fill="#e03535" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg> by <strong>Hirotec Team India</strong></div>
</body>
</html>
