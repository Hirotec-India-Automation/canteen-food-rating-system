<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>Hirotec Canteen Feedback</title>
  <!-- Built with love by Arul Frances Santhanam-->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: #000;
    }

    .hidden { display: none !important; }

    /* ---------- Status overlays (kept tiny so they never clutter) ---------- */
    .sync-badge {
      position: fixed; top: 14px; left: 14px;
      width: 34px; height: 34px; border-radius: 50%;
      background: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,.15);
      display: flex; align-items: center; justify-content: center;
      z-index: 30; cursor: pointer;
    }
    .sync-badge .dot { width: 12px; height: 12px; border-radius: 50%; background: #28a745; }
    .sync-badge.offline .dot { background: #dc3545; }
    .sync-badge.pending .dot { background: #ff9800; }
    .sync-badge .spinner {
      display: none; width: 16px; height: 16px;
      border: 2px solid rgba(0,123,255,.25); border-top-color: #007bff;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    .sync-badge.syncing .dot { display: none; }
    .sync-badge.syncing .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .ist-clock {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,.85); padding: 8px 18px; border-radius: 18px;
      font-size: 15px; font-weight: 600; color: #445; box-shadow: 0 2px 6px rgba(0,0,0,.08);
      z-index: 30; white-space: nowrap;
    }

    /* Idle countdown = thin bar, not a text badge */
    #idle-bar {
      position: fixed; top: 0; left: 0; height: 15px; width: 100%;
      background: #ff9800; transform-origin: left; z-index: 40;
      transition: transform 1s linear; display: none;
    }

    #admin-link {
      position: fixed; bottom: 14px; right: 14px; z-index: 30;
      width: 52px; height: 52px; border-radius: 50%;
      background: rgba(255,255,255,.9); box-shadow: 0 2px 8px rgba(0,0,0,.12);
      display: flex; align-items: center; justify-content: center;
      color: #7a8a99; font-size: 22px; text-decoration: none;
    }
    #admin-link:active { background: #dbe9f5; }

    /* ---------- Screens ---------- */
    .screen {
      display: none;
      flex-direction: column;
      width: 100%; max-width: 1100px;
      height: 100%;
      padding: 70px 24px 20px;
      animation: fadeIn .25s ease;
    }
    .screen.active { display: flex; }
    /* Rating screen sizes to content, not full height */
    #screen-rating.active { height: auto; align-self: center; padding: 40px 48px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: none;} }

    h1 {
      font-size: clamp(28px, 4.5vw, 46px);
      text-align: center; color: #123a5c; margin-bottom: 8px; font-weight: 700;
    }
    .subtitle { text-align: center; font-size: clamp(16px, 2vw, 22px); color: #5a6b7c; margin-bottom: 28px; }

    /* ---------- Rating screen ---------- */
    #screen-rating {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 10px 28px rgba(20, 60, 100, .20);
    }
    .rating-row {
      display: flex; flex-wrap: nowrap; justify-content: center; align-items: center;
      gap: clamp(4px, 1.8vw, 28px);
      flex: 0 0 auto;
    }
    #screen-rating h1 { color: #123a5c; }
    #screen-rating .subtitle { color: #5a6b7c; }
    .emoji-btn {
      border: none; background: transparent; cursor: pointer;
      width: clamp(58px, 18vw, 205px); height: clamp(58px, 18vw, 205px);
      border-radius: 50%; padding: 10px;
      transition: transform .15s ease, background-color .15s ease;
    }
    .emoji-btn img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    .emoji-btn:active { transform: scale(1.12); background-color: #cfe6fb; }
    .emoji-btn.picked { transform: scale(1.18); background-color: #007bff; }

    .hint { text-align: center; margin-top: 26px; font-size: clamp(15px, 1.8vw, 20px); color: #7a8a99; }

    /* ---------- Selection screens (liked / reasons) ---------- */
    .list-wrap {
      flex: 1; min-height: 0; overflow-y: auto;
      background: #ffffff; border-radius: 18px;
      box-shadow: 0 6px 18px rgba(20,60,100,.10);
			scrollbar-width: thin; scrollbar-color: #8ab8df transparent;
			-webkit-overflow-scrolling: touch;
			touch-action: pan-y; overscroll-behavior-y: contain;
      margin-bottom: 20px;
    }
		.list-wrap::-webkit-scrollbar { width: 10px; }
		.list-wrap::-webkit-scrollbar-thumb { background: #8ab8df; border-radius: 10px; }
		.list-wrap::-webkit-scrollbar-track { background: transparent; }

    .pick-row {
      display: flex; align-items: center; gap: 20px;
      min-height: 74px; padding: 10px 24px;
      font-size: clamp(20px, 2.6vw, 27px); font-weight: 500;
      border-bottom: 1px solid #eef3f8; cursor: pointer;
      transition: background-color .12s ease;
			white-space: nowrap;
    }
    .pick-row:active { background-color: #e3f0fd; }
    .pick-row input[type="checkbox"] {
      appearance: none; -webkit-appearance: none;
      width: 40px; height: 40px; flex: 0 0 40px;
      border: 3px solid #b9cbdc; border-radius: 10px;
      cursor: pointer; position: relative; background: #fff;
    }
    .pick-row input[type="checkbox"]:checked { background: #007bff; border-color: #007bff; }
    .pick-row input[type="checkbox"]:checked::after {
      content: "\f00c"; font-family: "Font Awesome 6 Free"; font-weight: 900;
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 24px;
    }
    .pick-row.checked { background-color: #d8ecff; }
	.pick-row span { pointer-events: none; overflow: hidden; text-overflow: ellipsis; }

    /* Reason grid per item: replaces the cramped table for touch */
    .reason-item { padding: 14px 20px 18px; border-bottom: 2px solid #eef3f8; }
    .reason-item.checked { background: #eaf5ff; }
    .reason-name {
      font-size: clamp(21px, 2.8vw, 28px); font-weight: 700; color: #123a5c; margin-bottom: 12px;
    }
    .reason-chips { display: flex; flex-wrap: wrap; gap: 12px; }
    .chip {
      border: 2px solid #c4d4e3; background: #fff; color: #33475b;
      border-radius: 999px; padding: 14px 26px;
      font-size: clamp(17px, 2vw, 22px); font-weight: 600; cursor: pointer;
      transition: background-color .12s ease, color .12s ease, border-color .12s ease;
      min-height: 56px;
    }
    .chip:active { background: #e3f0fd; }
    .chip.on { background: #007bff; border-color: #007bff; color: #fff; }

    /* ---------- Fixed side buttons ---------- */
    /* Skip — left edge, Submit — right edge, both fixed so they're always hittable */
    .btn-skip, .btn-submit-wrap {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 50;
      display: none;          /* hidden until a timed screen is active */
    }
    .btn-skip  { left: 0; }
    .btn-submit-wrap { right: 0; }

    .btn-skip.visible, .btn-submit-wrap.visible { display: flex; }

    /* Skip button */
    .btn-skip {
      align-items: center; justify-content: center; flex-direction: column;
      gap: 6px;
      width: 110px; min-height: 120px;
      background: #f0f4f8;
      border: none; border-radius: 0 20px 20px 0;
      box-shadow: 4px 0 14px rgba(0,0,0,.12);
      cursor: pointer;
      font-size: 20px; font-weight: 700; color: #6a7b8c;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s ease, transform .1s ease;
      padding: 0 10px;
    }
    .btn-skip:active { background: #dde4ec; transform: translateY(-50%) scale(.96); }
    .skip-countdown {
      font-size: 28px; font-weight: 900; color: #ff9800; line-height: 1;
    }

    /* Submit button with SVG ring countdown */
    .btn-submit-wrap {
      align-items: center; justify-content: center;
      width: 130px; min-height: 130px;
    }
    .btn-submit {
      position: relative;
      width: 120px; height: 120px;
      border: none; border-radius: 50%;
      background: #007bff; color: #fff;
      font-size: 17px; font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s ease, transform .1s ease;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 2px;
      box-shadow: 4px 0 14px rgba(0,0,0,.15);
    }
    .btn-submit:active { background: #005bab; transform: scale(.96); }
    .btn-submit:disabled { background: #c9d4de; cursor: not-allowed; }
    /* SVG ring sits on top of the button circle */
    .submit-ring {
      position: absolute; inset: -6px;
      width: calc(100% + 12px); height: calc(100% + 12px);
      transform: rotate(-90deg);
      pointer-events: none;
    }
    .submit-ring-track {
      fill: none; stroke: rgba(255,255,255,.25); stroke-width: 5;
    }
    .submit-ring-fill {
      fill: none; stroke: #fff; stroke-width: 5;
      stroke-linecap: round;
      transition: stroke-dashoffset .95s linear;
    }
    .submit-countdown {
      font-size: 13px; font-weight: 600; opacity: .85; line-height: 1;
    }
    /* When disabled, dim the ring */
    .btn-submit:disabled + .submit-ring .submit-ring-fill { stroke: rgba(255,255,255,.3); }

    /* screens no longer need huge side padding — the fixed buttons float outside */
    #screen-liked, #screen-reasons {
      padding-left: 130px;
      padding-right: 140px;
    }

    /* hide idle bar — countdown is now shown in the buttons */
    #idle-bar { display: none !important; }

    /* ---------- Thank you ---------- */
    #screen-thanks { align-items: center; justify-content: center; text-align: center; }
    #screen-thanks img { width: clamp(150px, 24vw, 240px); height: auto; margin-bottom: 18px; }
    #thanks-msg { font-size: clamp(30px, 5vw, 52px); font-weight: 700; color: #123a5c; max-width: 800px; }

    .app-footer {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
      font-size: 18px; font-weight: 600; color: #000; z-index: 20; white-space: nowrap;
      pointer-events: none;
    }
    .app-logo {
      position: fixed; top: 10px; right: 14px;
      height: 40px; z-index: 20; pointer-events: none;
    }

    @media (max-width: 640px) {
      .screen { padding: 64px 14px 16px; }
      #screen-rating { padding-left: 8px; padding-right: 8px; }
      #screen-liked, #screen-reasons { padding-left: 100px; padding-right: 110px; }
      .btn-skip { width: 88px; min-height: 100px; font-size: 17px; }
      .skip-countdown { font-size: 22px; }
      .btn-submit { width: 96px; height: 96px; font-size: 15px; }
      .btn-submit-wrap { width: 106px; min-height: 106px; }
      .app-logo { height: 30px; }
    }
  </style>
<base target="_blank">
</head>
<body>
  <div id="idle-bar"></div>

  <div id="sync-badge" class="sync-badge offline" title="Offline">
    <span class="dot"></span><span class="spinner"></span>
  </div>
  <div id="ist-clock" class="ist-clock"></div>
  <a id="admin-link" href="ratingLogin.html" aria-label="Admin login"><i class="fas fa-user-gear"></i></a>
  <button id="reload-btn" onclick="location.reload()" aria-label="Reload page" style="
    position:fixed; bottom:14px; left:14px; z-index:30;
    width:52px; height:52px; border-radius:50%;
    background:rgba(255,255,255,.9); box-shadow:0 2px 8px rgba(0,0,0,.12);
    border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:#7a8a99; font-size:22px;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
    transition:background .15s ease;
  "><i class="fas fa-rotate-right"></i></button>
  <img id="app-logo" src="images/logo.jpg" alt="" class="app-logo">

  <!-- 1. RATING -->
  <section id="screen-rating" class="screen active">
    <h1>How was your meal today?</h1>
    <p class="subtitle">Tap a smiley to rate</p>
    <div class="rating-row" id="rating-row"></div>
    <p class="subtitle" style="margin-top: 16px; margin-bottom: 0;">Your feedback helps us serve you better</p>
    <div id="feedback-count-wrap" style="margin-top:18px; display:flex; align-items:center; justify-content:center; gap:10px;">
      <span style="font-size:15px; color:#7a8a99; font-weight:500;">Today's total feedback count</span>
      <span id="feedback-count" style="
        background:#007bff; color:#fff;
        font-size:22px; font-weight:800;
        min-width:48px; height:48px; border-radius:999px;
        display:inline-flex; align-items:center; justify-content:center;
        padding:0 14px; box-shadow:0 2px 8px rgba(0,123,255,.3);
        line-height:1;
      ">0</span>
    </div>
  </section>

  <!-- 2. LIKED ITEMS (rating 4-5) -->
  <section id="screen-liked" class="screen">
    <h1 id="liked-title">What did you like?</h1>
    <p class="subtitle">Tap the items you enjoyed</p>
    <div class="list-wrap" id="liked-list"></div>
  </section>

  <!-- 3. REASONS (rating 1-3) -->
  <section id="screen-reasons" class="screen">
    <h1>Help us improve</h1>
    <p class="subtitle">Tap the items that need attention</p>
    <div class="list-wrap" id="reason-list"></div>
  </section>

  <!-- 4. THANK YOU -->
  <section id="screen-thanks" class="screen">
    <img id="thanks-img" src="images/5.png" alt="">
    <h2 id="thanks-msg">Thank you for your feedback!</h2>
  </section>

  <!-- Fixed Skip button — left edge -->
  <button id="global-skip" class="btn-skip" aria-label="Skip">
    <span class="skip-countdown" id="skip-countdown">15</span>
    Skip
  </button>

  <!-- Fixed Submit button — right edge, with SVG ring timer -->
  <!-- r=54 → circumference = 2π×54 ≈ 339.3 -->
  <div class="btn-submit-wrap" id="submit-wrap">
    <button id="global-submit" class="btn-submit" aria-label="Submit">
      Submit
      <span class="submit-countdown" id="submit-countdown">15s</span>
    </button>
    <svg class="submit-ring" viewBox="0 0 120 120" aria-hidden="true">
      <circle class="submit-ring-track" cx="60" cy="60" r="54"/>
      <circle class="submit-ring-fill" cx="60" cy="60" r="54"
              stroke-dasharray="339.3" stroke-dashoffset="339.3"
              id="submit-ring-fill"/>
    </svg>
  </div>

  <script src="assets/js/supabase-sync.js"></script>
  <script>
    /* =========================================================
       Touch-optimized kiosk flow
       1) Rate with one tap  → auto-advances
       2) Rating 4-5  → "what did you like"   (Skip left / Submit right)
       3) Rating 1-3  → "what went wrong"     (Skip left / Submit right)
       4) Thank-you, auto-reset after 3 s
       Both timed screens: 15-second countdown shown in the buttons.
       Any interaction resets the timer.
       ========================================================= */

    const IDLE_TIMEOUT_SECONDS = 15;
    const RING_CIRCUMFERENCE   = 339.3; // 2π × r=54

    let ratingValue   = null;
    let idleInterval  = null;
    let idleSecsLeft  = IDLE_TIMEOUT_SECONDS;
    let currentScreen = null; // tracks which timed screen is active

    const thanksImg   = document.getElementById('thanks-img');
    const thanksMsg   = document.getElementById('thanks-msg');
    const adminLink   = document.getElementById('admin-link');

    // Floating buttons
    const globalSkip      = document.getElementById('global-skip');
    const globalSubmit    = document.getElementById('global-submit');
    const submitWrap      = document.getElementById('submit-wrap');
    const skipCountdown   = document.getElementById('skip-countdown');
    const submitCountdown = document.getElementById('submit-countdown');
    const ringFill        = document.getElementById('submit-ring-fill');

    /* ---------- Show / hide floating buttons ---------- */
    const TIMED_SCREENS = ['screen-liked', 'screen-reasons'];

    function showButtons(visible) {
      if (visible) {
        globalSkip.classList.add('visible');
        submitWrap.classList.add('visible');
      } else {
        globalSkip.classList.remove('visible');
        submitWrap.classList.remove('visible');
      }
    }

    /* ---------- Timer helpers ---------- */
    function updateTimerUI(secs) {
      skipCountdown.textContent  = secs;
      submitCountdown.textContent = secs + 's';
      // Ring fills from empty → full as time counts down
      const progress = 1 - (secs / IDLE_TIMEOUT_SECONDS);
      ringFill.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - progress);
    }

    function startIdle(screenId) {
      stopIdle();
      currentScreen = screenId;
      idleSecsLeft  = IDLE_TIMEOUT_SECONDS;
      updateTimerUI(idleSecsLeft);
      idleInterval  = setInterval(() => {
        idleSecsLeft--;
        updateTimerUI(Math.max(idleSecsLeft, 0));
        if (idleSecsLeft <= 0) {
          stopIdle();
          // Auto-fire: submit if anything selected, otherwise skip
          if (currentScreen === 'screen-liked') {
            likedList.querySelectorAll('input:checked').length
              ? submitLiked() : (saveRatingOnly(), showThanks());
          } else {
            reasonList.querySelectorAll('.chip.on').length
              ? submitReasons() : (saveRatingOnly(), showThanks());
          }
        }
      }, 1000);
    }

    function stopIdle() {
      if (idleInterval) clearInterval(idleInterval);
      idleInterval = null;
    }

    // Any tap on a timed screen resets the countdown
    document.addEventListener('pointerdown', () => {
      if (currentScreen && TIMED_SCREENS.includes(currentScreen)) {
        startIdle(currentScreen);
      }
    }, true);

    /* ---------- Screen switching ---------- */
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.getElementById('app-logo').classList.toggle('hidden', id === 'screen-reasons');
      adminLink.classList.toggle('hidden', TIMED_SCREENS.includes(id));

      if (TIMED_SCREENS.includes(id)) {
        showButtons(true);
        startIdle(id);
      } else {
        showButtons(false);
        stopIdle();
        currentScreen = null;
      }
    }

    /* ---------- Global Skip ---------- */
    globalSkip.addEventListener('click', () => {
      stopIdle();
      saveRatingOnly();
      showThanks();
    });

    /* ---------- Global Submit ---------- */
    globalSubmit.addEventListener('click', () => {
      if (globalSubmit.disabled) return;
      stopIdle();
      if (currentScreen === 'screen-liked') submitLiked();
      else submitReasons();
    });

    /* ---------- Rating screen ---------- */
    const ratingRow = document.getElementById('rating-row');
    let advancing = false;
    let completionAudioContext = null;

    for (let v = 5; v >= 1; v--) {
      const btn = document.createElement('button');
      btn.className = 'emoji-btn';
      btn.dataset.value = v;
      btn.setAttribute('aria-label', v + ' out of 5');
      btn.innerHTML = `<img src="images/${v}.png" alt="">`;
      btn.addEventListener('click', () => pickRating(v, btn));
      ratingRow.appendChild(btn);
    }

    function pickRating(v, btn) {
      if (advancing) return;
      advancing = true;
      ratingValue = v;
      primeCompletionAudio();
      btn.classList.add('picked');
      setTimeout(() => {
        if (v >= 4) {
          document.getElementById('liked-title').textContent =
            v === 5 ? 'What did you love?' : 'What did you like?';
          showScreen('screen-liked');
        } else {
          showScreen('screen-reasons');
        }
      }, 650);
    }

    /* ---------- Data saving ---------- */
    function appendToLocalStorage(key, data) {
      const existing = JSON.parse(localStorage.getItem(key)) || [];
      existing.push(data);
      localStorage.setItem(key, JSON.stringify(existing));
    }
    function cloudSafe(rows) {
      if (typeof cloudSaveFeedback === 'function') cloudSaveFeedback(rows);
    }
    function saveRatingOnly() {
      const date = new Date().toISOString().split('T')[0];
      appendToLocalStorage('canteenFeedback', { date, rating: ratingValue });
      cloudSafe([{ feedback_date: date, rating: ratingValue, feedback_type: 'rating_only' }]);
    }
    function saveLiked(items) {
      const date = new Date().toISOString().split('T')[0];
      appendToLocalStorage('canteenFeedback', { date, rating: ratingValue, goodFood: items });
      cloudSafe(items.map(food_item => ({
        feedback_date: date, rating: ratingValue, feedback_type: 'good_food', food_item
      })));
    }
    function saveReasons(reasons) {
      const date = new Date().toISOString().split('T')[0];
      appendToLocalStorage('canteenFeedback', { date, rating: ratingValue, reasons });
      cloudSafe(reasons.map(r => ({
        feedback_date: date, rating: ratingValue, feedback_type: 'reason',
        food_item: r.foodItem, reason: r.reason
      })));
    }

    /* ---------- Liked items screen ---------- */
    const likedList = document.getElementById('liked-list');

    function submitLiked() {
      const items = Array.from(likedList.querySelectorAll('input:checked')).map(cb => cb.value);
      if (items.length) saveLiked(items); else saveRatingOnly();
      showThanks();
    }

    /* ---------- Reasons screen ---------- */
    const reasonList = document.getElementById('reason-list');

    function submitReasons() {
      const picked = [];
      reasonList.querySelectorAll('.reason-item').forEach(item => {
        const food = item.dataset.food;
        item.querySelectorAll('.chip.on').forEach(chip =>
          picked.push({ foodItem: food, reason: chip.dataset.reason }));
      });
      if (picked.length) saveReasons(picked); else saveRatingOnly();
      showThanks();
    }

    /* ---------- Build lists from today's menu ---------- */
    const REASONS = ['Salty', 'Too Spicy', 'Undercooked', 'Overcooked', 'Not Fresh', 'Too Oily'];

    function buildLikedList(items) {
      likedList.innerHTML = '';
      items.forEach((item, i) => {
        const label = document.createElement('label');
        label.className = 'pick-row';
        label.innerHTML = `<input type="checkbox" id="liked-${i}" value="${item}"><span>${item}</span>`;
        const cb = label.querySelector('input');
        cb.addEventListener('change', () => {
          label.classList.toggle('checked', cb.checked);
          // Submit is always enabled (timer will auto-submit too); just update visual state
        });
        likedList.appendChild(label);
      });
    }

    function buildReasonList(items) {
      reasonList.innerHTML = '';
      items.forEach(item => {
        const wrap = document.createElement('div');
        wrap.className = 'reason-item';
        wrap.dataset.food = item;
        const name = document.createElement('div');
        name.className = 'reason-name';
        name.textContent = item;
        const chips = document.createElement('div');
        chips.className = 'reason-chips';
        REASONS.forEach(r => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'chip';
          chip.dataset.reason = r;
          chip.textContent = r;
          chip.addEventListener('click', () => {
            chip.classList.toggle('on');
            wrap.classList.toggle('checked', !!wrap.querySelector('.chip.on'));
          });
          chips.appendChild(chip);
        });
        wrap.appendChild(name);
        wrap.appendChild(chips);
        reasonList.appendChild(wrap);
      });
    }

    /* ---------- Thank you + reset ---------- */
    function primeCompletionAudio() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!completionAudioContext) completionAudioContext = new Ctx();
      if (completionAudioContext.state === 'suspended') completionAudioContext.resume();
    }

    function playCompletionSound() {
      primeCompletionAudio();
      const ctx = completionAudioContext;
      if (!ctx) return;
      const now  = ctx.currentTime;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
      gain.connect(ctx.destination);
      [659.25, 783.99].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq;
        osc.connect(gain);
        osc.start(now + i * 0.12);
        osc.stop(now + 0.5);
      });
    }

    function showThanks() {
      const msgs = {
        5: "Amazing! We're glad you enjoyed it. Thank you!",
        4: "Great! We'll keep it up. Thank you!",
        3: "Thanks! We'll keep improving.",
        2: "Sorry to hear that. We'll work on it. Thank you!",
        1: "We apologize for the experience. We'll work on it. Thank you!"
      };
      thanksImg.src = ratingValue === 1 ? 'images/2.png' : `images/${ratingValue}.png`;
      thanksMsg.textContent = msgs[ratingValue] || 'Thank you for your feedback!';
      playCompletionSound();
      refreshFeedbackCount(); // update count immediately after each submission
      showScreen('screen-thanks');
      setTimeout(resetToRating, 3000);
    }

    /* ---------- Today's feedback count ---------- */
    async function refreshFeedbackCount() {
      const today = new Date().toISOString().split('T')[0];
      let count = 0;
      try {
        if (typeof cloudFetchFeedback === 'function') {
          const rows = await cloudFetchFeedback();
          if (rows) {
            // count distinct submissions by grouping on (feedback_date, created_at or rowid)
            // since each submission may produce multiple rows, count unique rating-only + good_food + reason entries per date
            // simplest reliable way: count rows where feedback_date = today
            count = rows.filter(r => r.feedback_date === today).length;
            // if every submission writes N rows (one per food item), we want submission count not row count
            // use rating_only rows as 1 submission, others grouped — but we don't have a session id
            // fallback: just show row count with a label, or use local storage for exact submission count
          }
        }
      } catch (e) { /* offline */ }

      // Always also check local storage for offline submissions today
      const local = JSON.parse(localStorage.getItem('canteenFeedback') || '[]');
      const localToday = local.filter(e => e.date === today).length;

      // Use whichever is larger (cloud may already include local once synced)
      count = Math.max(count, localToday);

      document.getElementById('feedback-count').textContent = count;
    }

    function resetToRating() {
      stopIdle();
      ratingValue   = null;
      advancing     = false;
      currentScreen = null;
      document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('picked'));
      likedList.querySelectorAll('input:checked').forEach(cb => cb.checked = false);
      likedList.querySelectorAll('.pick-row').forEach(r => r.classList.remove('checked'));
      reasonList.querySelectorAll('.chip.on').forEach(c => c.classList.remove('on'));
      reasonList.querySelectorAll('.reason-item').forEach(r => r.classList.remove('checked'));
      showScreen('screen-rating');
    }

    /* ---------- Menu loading (Supabase with offline fallback) ---------- */
    async function getTodayMenuItems() {
      const today = new Date().toISOString().split('T')[0];
      const cache = JSON.parse(localStorage.getItem('dailyMenus')) || {};
      try {
        if (typeof cloudFetchDailyMenu === 'function') {
          const cloud = await cloudFetchDailyMenu(today);
          if (cloud && cloud.length) {
            cache[today] = cloud;
            localStorage.setItem('dailyMenus', JSON.stringify(cache));
            return cloud;
          }
        }
      } catch (e) { /* offline — use cache */ }
      return cache[today] || [];
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const items = await getTodayMenuItems();
      if (items.length) {
        buildLikedList(items);
        buildReasonList(items);
      }
      refreshFeedbackCount();
    });

    /* ---------- IST clock ---------- */
    const istClock = document.getElementById('ist-clock');
    const istFmt = new Intl.DateTimeFormat('en-IN', {
      timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: true
    });
    const tickClock = () => istClock.textContent = istFmt.format(new Date());
    tickClock(); setInterval(tickClock, 1000);

    /* ---------- Sync badge ---------- */
    const syncBadge = document.getElementById('sync-badge');
    function updateSyncBadge(status) {
      const online  = status ? status.online  : navigator.onLine;
      const pending = status ? status.pending
        : JSON.parse(localStorage.getItem('pendingSupabaseOps') || '[]').length;
      const flushing = status ? status.flushing : false;
      syncBadge.classList.toggle('offline',  !online);
      syncBadge.classList.toggle('syncing',   online && flushing);
      syncBadge.classList.toggle('pending',   online && !flushing && pending > 0);
      syncBadge.title = !online
        ? 'Offline' + (pending ? ` – ${pending} queued` : '')
        : flushing ? 'Syncing…'
        : pending  ? `${pending} item(s) waiting to sync`
        : 'Online';
    }
    if (typeof onSyncStatusChange === 'function') onSyncStatusChange(updateSyncBadge);
    window.addEventListener('online',  () => updateSyncBadge());
    window.addEventListener('offline', () => updateSyncBadge());
    updateSyncBadge();
    document.addEventListener('contextmenu', e => e.preventDefault());
    syncBadge.addEventListener('click', () => {
      const pending   = JSON.parse(localStorage.getItem('pendingSupabaseOps') || '[]').length;
      const lastError = typeof getLastSupabaseError === 'function' ? getLastSupabaseError() : null;
      if (!pending && !lastError) { alert('Everything is synced to Database.'); return; }
      let msg = pending + ' item(s) waiting to sync to Database.';
      if (lastError) {
        msg += `\n\nLast error (${lastError.at}):\n${lastError.context}\n${lastError.message || ''}`;
        if (lastError.hint) msg += `\nHint: ${lastError.hint}`;
        if (lastError.code) msg += `\nCode: ${lastError.code}`;
      }
      alert(msg);
    });
  </script>
