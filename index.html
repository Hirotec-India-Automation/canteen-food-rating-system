  		<style>

			/* Sync status badge: icon-only so it stays compact on a 7" display */
			.sync-badge {

		<script src="assets/js/supabase-sync.js"></script>
 		<script>
			const ratingScreen = document.getElementById("rating-screen");
			const thankYouScreen = document.getElementById("thank-you-screen");
			const foodScreen = document.getElementById("food-screen");
			const moreFeedbackScreen = document.getElementById("more-feedback-screen");
			const ratingOptions = document.querySelectorAll(".rating-options input[type='radio']");
			const submitFoodReasonsButton = document.getElementById("submit-food-reasons");
			const submitGoodFeedbackButton = document.getElementById("submit-good-feedback");
			const reasonOptions = document.querySelectorAll(".reason-options input[type='checkbox']");
			const tableBody = document.getElementById("food-reason-table-body");
			const messageDiv = document.getElementById("message");
			const userIcon = document.getElementById("user-icon");
			const customAlert = document.getElementById("custom-alert");
			const alertYesButton = document.getElementById("alert-yes");
			const alertNoButton = document.getElementById("alert-no");
			const ratingNext = document.getElementById("rating-next");
			const idleTimerBadge = document.getElementById("idle-timer-badge");
			const idleTimerCount = document.getElementById("idle-timer-count");

			// Screens that auto-submit (if something is selected) or return to the rating screen after 15s of inactivity
			const IDLE_TIMEOUT_SECONDS = 15;
			const IDLE_TIMER_SCREENS = ["food-screen", "more-feedback-screen"];
			let idleCountdownInterval = null;
			let idleActiveScreen = null;
			let idleSecondsLeft = IDLE_TIMEOUT_SECONDS;

			function stopIdleTimer() {
				if (idleCountdownInterval) {
					clearInterval(idleCountdownInterval);
					idleCountdownInterval = null;
				}
				idleActiveScreen = null;
				idleTimerBadge.classList.add("hidden");
			}

			function startIdleTimer(screenId) {
				stopIdleTimer();
				idleActiveScreen = screenId;
				idleSecondsLeft = IDLE_TIMEOUT_SECONDS;
				idleTimerCount.textContent = idleSecondsLeft;
				idleTimerBadge.classList.remove("hidden");
				idleCountdownInterval = setInterval(() => {
					idleSecondsLeft--;
					idleTimerCount.textContent = idleSecondsLeft;
					if (idleSecondsLeft <= 0) {
						const timedOutScreen = idleActiveScreen;
						stopIdleTimer();
						handleIdleTimeout(timedOutScreen);
					}
				}, 1000);
			}

			// Any tap/click on the current idle-timed screen restarts its countdown
			function resetIdleTimer() {
				if (idleActiveScreen) startIdleTimer(idleActiveScreen);
			}
			document.addEventListener("click", resetIdleTimer, true);

			function handleIdleTimeout(screenId) {
				if (screenId === "food-screen") {
					if (document.querySelectorAll(".reason-checkbox:checked").length > 0) {
						submitFoodReasonsButton.click();
					} else {
						resetForm();
					}
				} else if (screenId === "more-feedback-screen") {
					if (document.querySelectorAll(".good-food-option:checked").length > 0) {
						submitGoodFeedbackButton.click();
					} else {
						resetForm();
					}
				}
			}

			document.addEventListener('DOMContentLoaded', async function() {
				const foodItemsForToday = await getTodayMenuItems();
				populateFoodReasonTable(foodItemsForToday);
        		addCheckboxListeners();
        		populateGoodFoodOptions(foodItemsForToday);
				customAlert.classList.add("hidden"); // Confirm it remains hidden on load
			});

			// Sync status badge: reflects online/offline state and pending queued writes
			const syncBadge = document.getElementById("sync-badge");
			function updateSyncBadge(status) {
				const online = status ? status.online : navigator.onLine;
				const pending = status ? status.pending : JSON.parse(localStorage.getItem("pendingSupabaseOps") || "[]").length;
				const flushing = status ? status.flushing : false;
				syncBadge.classList.toggle("offline", !online);
				syncBadge.classList.toggle("syncing", online && flushing);
				syncBadge.classList.toggle("pending", online && !flushing && pending > 0);
				syncBadge.title = !online
					? `Offline${pending ? ` \u2013 ${pending} queued` : ""}`
					: flushing ? "Syncing\u2026" : pending ? `${pending} item(s) waiting to sync` : "Online";
			}
			onSyncStatusChange(updateSyncBadge);
			window.addEventListener("online", () => updateSyncBadge());
			window.addEventListener("offline", () => updateSyncBadge());
			document.addEventListener('DOMContentLoaded', () => updateSyncBadge());
			document.addEventListener('contextmenu', e => e.preventDefault());

			// Tap the badge to see why items are stuck (kiosk screens have no devtools access)
			syncBadge.addEventListener("click", () => {
				const pending = JSON.parse(localStorage.getItem("pendingSupabaseOps") || "[]").length;
				const lastError = getLastSupabaseError();
				if (!pending && !lastError) {
					alert("Everything is synced to Supabase.");
					return;
				}
				let msg = `${pending} item(s) waiting to sync to Supabase.`;
				if (lastError) {
					msg += `\n\nLast error (${lastError.at}):\n${lastError.context}\n${lastError.message || ""}`;
					if (lastError.hint) msg += `\nHint: ${lastError.hint}`;
					if (lastError.code) msg += `\nCode: ${lastError.code}`;
				}
				alert(msg);
			});

			// Live IST clock, independent of the device's own timezone/locale
			const istClock = document.getElementById("ist-clock");
			const istFormatter = new Intl.DateTimeFormat("en-IN", {
				timeZone: "Asia/Kolkata",
				day: "2-digit",
				month: "short",
				year: "numeric",
				hour: "2-digit",
				minute: "2-digit",
				second: "2-digit",
				hour12: true
			});
			function updateIstClock() {
				istClock.textContent = istFormatter.format(new Date());
			}
			updateIstClock();
			setInterval(updateIstClock, 1000);

			// Fetch today's menu from Supabase, falling back to the local cache when offline
			async function getTodayMenuItems() {
				const today = new Date().toISOString().split('T')[0];
				const dailyMenus = JSON.parse(localStorage.getItem('dailyMenus')) || {};
				const cloudItems = await cloudFetchDailyMenu(today);
				if (cloudItems && cloudItems.length) {
					dailyMenus[today] = cloudItems;
					localStorage.setItem('dailyMenus', JSON.stringify(dailyMenus));
					return cloudItems;
				}
				return dailyMenus[today] || ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j'];
			}

			// Helper function to append data to localStorage
			function appendToLocalStorage(key, data) {
				const existingData = JSON.parse(localStorage.getItem(key)) || [];
				existingData.push(data);

  <script>
    /* =========================================================
       Touch-optimized kiosk flow
       1) Rate with one tap (auto-advances, no Next button)
       2) Rating 4-5 -> "what did you like"   (optional, Skip)
       3) Rating 1-3 -> "what went wrong"     (optional, Skip)
       4) Thank-you, auto-reset
       ========================================================= */

    const IDLE_TIMEOUT_SECONDS = 15;

    let ratingValue = null;
    let idleInterval = null;
    let idleSecondsLeft = IDLE_TIMEOUT_SECONDS;

    const idleBar = document.getElementById('idle-bar');
    const thanksImg = document.getElementById('thanks-img');
    const thanksMsg = document.getElementById('thanks-msg');
	const adminLink = document.getElementById('admin-link');

    /* ---------- Screen switching ---------- */
    const TIMED_SCREENS = ['screen-liked', 'screen-reasons'];
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.getElementById('app-logo').classList.toggle('hidden', id === 'screen-reasons');
	adminLink.classList.toggle('hidden', TIMED_SCREENS.includes(id));
      if (TIMED_SCREENS.includes(id)) startIdle(id); else stopIdle();
    }

    /* ---------- Idle auto-submit ---------- */
    function startIdle(screenId) {
      stopIdle();
      idleSecondsLeft = IDLE_TIMEOUT_SECONDS;
      idleBar.style.display = 'block';
      idleBar.style.transform = 'scaleX(1)';
      idleInterval = setInterval(() => {
        idleSecondsLeft--;
        idleBar.style.transform = `scaleX(${Math.max(idleSecondsLeft, 0) / IDLE_TIMEOUT_SECONDS})`;
        if (idleSecondsLeft <= 0) {
          const timed = screenId;
          stopIdle();
          if (timed === 'screen-liked') {
            document.querySelectorAll('#liked-list input:checked').length
              ? submitLiked() : (saveRatingOnly(), resetToRating());
          } else {
            document.querySelectorAll('#reason-list .chip.on').length
              ? submitReasons() : (saveRatingOnly(), resetToRating());
          }
        }
      }, 1000);
    }
    function stopIdle() {
      if (idleInterval) clearInterval(idleInterval);
      idleInterval = null;
      idleBar.style.display = 'none';
    }
    document.addEventListener('click', () => {
      const active = document.querySelector('.screen.active');
      if (active && TIMED_SCREENS.includes(active.id)) startIdle(active.id);
    }, true);

    /* ---------- Rating screen ---------- */
    const ratingRow = document.getElementById('rating-row');
    let advancing = false;
    let completionAudioContext = null;
    for (let v = 5; v >= 1; v--) {
      const btn = document.createElement('button');
      btn.className = 'emoji-btn';
      btn.dataset.value = v;
      btn.setAttribute('aria-label', v + ' out of 5');
      btn.innerHTML = `<img src="images/${v}.png" alt="">`;
      btn.addEventListener('click', () => pickRating(v, btn));
      ratingRow.appendChild(btn);
    }
    function pickRating(v, btn) {
      if (advancing) return;
      advancing = true;
      ratingValue = v;
      primeCompletionAudio();
      btn.classList.add('picked');
      setTimeout(() => {
        if (v >= 4) {
          document.getElementById('liked-title').textContent =
            v === 5 ? 'What did you love?' : 'What did you like?';
          showScreen('screen-liked');
        } else {
          showScreen('screen-reasons');
        }
      }, 650);
    }

    /* ---------- Data saving ---------- */
    function appendToLocalStorage(key, data) {
      const existing = JSON.parse(localStorage.getItem(key)) || [];
      existing.push(data);
      localStorage.setItem(key, JSON.stringify(existing));
    }
    function cloudSafe(rows) {
      if (typeof cloudSaveFeedback === 'function') cloudSaveFeedback(rows);
    }
    function saveRatingOnly() {
      const date = new Date().toISOString().split('T')[0];
      appendToLocalStorage('canteenFeedback', { date, rating: ratingValue });
      cloudSafe([{ feedback_date: date, rating: ratingValue, feedback_type: 'rating_only' }]);
    }
    function saveLiked(items) {
      const date = new Date().toISOString().split('T')[0];
      appendToLocalStorage('canteenFeedback', { date, rating: ratingValue, goodFood: items });
      cloudSafe(items.map(food_item => ({
        feedback_date: date, rating: ratingValue, feedback_type: 'good_food', food_item
      })));
    }
    function saveReasons(reasons) {
      const date = new Date().toISOString().split('T')[0];
      appendToLocalStorage('canteenFeedback', { date, rating: ratingValue, reasons });
      cloudSafe(reasons.map(r => ({
        feedback_date: date, rating: ratingValue, feedback_type: 'reason',
        food_item: r.foodItem, reason: r.reason
      })));
    }

    /* ---------- Liked items screen ---------- */
    const likedList = document.getElementById('liked-list');
    const likedSubmit = document.getElementById('liked-submit');
    document.getElementById('liked-skip').addEventListener('click', () => { saveRatingOnly(); showThanks(); });
    likedSubmit.addEventListener('click', submitLiked);
    function submitLiked() {
      const items = Array.from(likedList.querySelectorAll('input:checked')).map(cb => cb.value);
      if (!items.length) { saveRatingOnly(); } else { saveLiked(items); }
      showThanks();
    }

    /* ---------- Reasons screen ---------- */
    const reasonList = document.getElementById('reason-list');
    const reasonsSubmit = document.getElementById('reasons-submit');
    document.getElementById('reasons-skip').addEventListener('click', () => { saveRatingOnly(); showThanks(); });
    reasonsSubmit.addEventListener('click', submitReasons);
    function submitReasons() {
      const picked = [];
      reasonList.querySelectorAll('.reason-item').forEach(item => {
        const food = item.dataset.food;
        item.querySelectorAll('.chip.on').forEach(chip => picked.push({ foodItem: food, reason: chip.dataset.reason }));
      });
      if (!picked.length) { saveRatingOnly(); } else { saveReasons(picked); }
      showThanks();
    }

    /* ---------- Build lists from today's menu ---------- */
    const REASONS = ['Salty', 'Too Spicy', 'Undercooked', 'Overcooked', 'Not Fresh', 'Too Oily'];

    function buildLikedList(items) {
      likedList.innerHTML = '';
      items.forEach((item, i) => {
        const label = document.createElement('label');
        label.className = 'pick-row';
        label.innerHTML = `<input type="checkbox" id="liked-${i}" value="${item}"><span>${item}</span>`;
        const cb = label.querySelector('input');
        cb.addEventListener('change', () => {
          label.classList.toggle('checked', cb.checked);
          likedSubmit.disabled = !likedList.querySelector('input:checked');
        });
        likedList.appendChild(label);
      });
      likedSubmit.disabled = true;
    }

    function buildReasonList(items) {
      reasonList.innerHTML = '';
      items.forEach(item => {
        const wrap = document.createElement('div');
        wrap.className = 'reason-item';
        wrap.dataset.food = item;
        const name = document.createElement('div');
        name.className = 'reason-name';
        name.textContent = item;
        const chips = document.createElement('div');
        chips.className = 'reason-chips';
        REASONS.forEach(r => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'chip';
          chip.dataset.reason = r;
          chip.textContent = r;
          chip.addEventListener('click', () => {
            chip.classList.toggle('on');
            wrap.classList.toggle('checked', !!wrap.querySelector('.chip.on'));
            reasonsSubmit.disabled = !reasonList.querySelector('.chip.on');
          });
          chips.appendChild(chip);
        });
        wrap.appendChild(name);
        wrap.appendChild(chips);
        reasonList.appendChild(wrap);
      });
      reasonsSubmit.disabled = true;
    }

    /* ---------- Thank you + reset ---------- */
    function primeCompletionAudio() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      if (!completionAudioContext) completionAudioContext = new AudioContextClass();
      if (completionAudioContext.state === 'suspended') completionAudioContext.resume();
    }

    function playCompletionSound() {
      primeCompletionAudio();
      const context = completionAudioContext;
      if (!context) return;
      const now = context.currentTime;
      const gain = context.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
      gain.connect(context.destination);

      [659.25, 783.99].forEach((frequency, index) => {
        const oscillator = context.createOscillator();
        oscillator.type = 'sine';
        oscillator.frequency.value = frequency;
        oscillator.connect(gain);
        oscillator.start(now + index * 0.12);
        oscillator.stop(now + 0.5);
      });
    }

    function showThanks() {
      const msgs = {
        5: "Amazing! We're glad you enjoyed it. Thank you!",
        4: "Great! We'll keep it up. Thank you!",
        3: "Thanks! We'll keep improving.",
        2: "Sorry to hear that. We'll work on it. Thank you!",
        1: "We apologize for the experience. We'll work on it. Thank you!"
      };
	thanksImg.src = ratingValue === 1 ? 'images/2.png' : `images/${ratingValue}.png`;
      thanksMsg.textContent = msgs[ratingValue] || 'Thank you for your feedback!';
      playCompletionSound();
      showScreen('screen-thanks');
      setTimeout(resetToRating, 3000);
    }

    function resetToRating() {
      stopIdle();
      ratingValue = null;
      advancing = false;
      document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('picked'));
      likedList.querySelectorAll('input:checked').forEach(cb => cb.checked = false);
      likedList.querySelectorAll('.pick-row').forEach(r => r.classList.remove('checked'));
      reasonList.querySelectorAll('.chip.on').forEach(c => c.classList.remove('on'));
      reasonList.querySelectorAll('.reason-item').forEach(r => r.classList.remove('checked'));
      likedSubmit.disabled = true;
      reasonsSubmit.disabled = true;
      showScreen('screen-rating');
    }

    /* ---------- Menu loading (Supabase with offline fallback) ---------- */
    async function getTodayMenuItems() {
      const today = new Date().toISOString().split('T')[0];
      const cache = JSON.parse(localStorage.getItem('dailyMenus')) || {};
      try {
        if (typeof cloudFetchDailyMenu === 'function') {
          const cloud = await cloudFetchDailyMenu(today);
          if (cloud && cloud.length) {
            cache[today] = cloud;
            localStorage.setItem('dailyMenus', JSON.stringify(cache));
            return cloud;
          }
        }
      } catch (e) { /* offline or misconfigured — use cache */ }
      return cache[today] || [];
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const items = await getTodayMenuItems();
      if (items.length) {
        buildLikedList(items);
        buildReasonList(items);
      }
    });

    /* ---------- IST clock ---------- */
    const istClock = document.getElementById('ist-clock');
    const istFmt = new Intl.DateTimeFormat('en-IN', {
      timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: true
    });
    const tickClock = () => istClock.textContent = istFmt.format(new Date());
    tickClock(); setInterval(tickClock, 1000);

    /* ---------- Sync badge (graceful if supabase-sync.js absent) ---------- */
    const syncBadge = document.getElementById('sync-badge');
    function updateSyncBadge(status) {
      const online = status ? status.online : navigator.onLine;
      const pending = status ? status.pending
        : JSON.parse(localStorage.getItem('pendingSupabaseOps') || '[]').length;
      const flushing = status ? status.flushing : false;
      syncBadge.classList.toggle('offline', !online);
      syncBadge.classList.toggle('syncing', online && flushing);
      syncBadge.classList.toggle('pending', online && !flushing && pending > 0);
      syncBadge.title = !online ? 'Offline' + (pending ? ` – ${pending} queued` : '')
        : flushing ? 'Syncing…' : pending ? `${pending} item(s) waiting to sync` : 'Online';
    }
    if (typeof onSyncStatusChange === 'function') onSyncStatusChange(updateSyncBadge);
    window.addEventListener('online', () => updateSyncBadge());
    window.addEventListener('offline', () => updateSyncBadge());
    updateSyncBadge();
    document.addEventListener('contextmenu', e => e.preventDefault());
    syncBadge.addEventListener('click', () => {
      const pending = JSON.parse(localStorage.getItem('pendingSupabaseOps') || '[]').length;
      const lastError = typeof getLastSupabaseError === 'function' ? getLastSupabaseError() : null;
      if (!pending && !lastError) { alert('Everything is synced to Supabase.'); return; }
      let msg = pending + ' item(s) waiting to sync to Supabase.';
      if (lastError) {
        msg += `\n\nLast error (${lastError.at}):\n${lastError.context}\n${lastError.message || ''}`;
        if (lastError.hint) msg += `\nHint: ${lastError.hint}`;
        if (lastError.code) msg += `\nCode: ${lastError.code}`;
      }
      alert(msg);
    });
  </script>
