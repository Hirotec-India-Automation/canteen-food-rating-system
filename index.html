<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>Hirotec Canteen Feedback</title>
  <style>
    * {
      box-sizing: border-box; margin: 0; padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%; overflow: hidden;
      overscroll-behavior: none; touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
    }
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
    }
    .hidden { display: none !important; }

    /* ── Fixed overlays ─────────────────────────────────────── */
    .ist-clock {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,.85); padding: 8px 18px; border-radius: 18px;
      font-size: 15px; font-weight: 600; color: #445;
      box-shadow: 0 2px 6px rgba(0,0,0,.08); z-index: 30; white-space: nowrap;
    }
    #admin-link {
      position: fixed; bottom: 14px; right: 14px; z-index: 30;
      width: 52px; height: 52px; border-radius: 50%;
      background: rgba(255,255,255,.9); box-shadow: 0 2px 8px rgba(0,0,0,.12);
      display: flex; align-items: center; justify-content: center;
      color: #7a8a99; font-size: 22px; text-decoration: none;
    }
    #admin-link:active { background: #dbe9f5; }
    #app-logo {
      position: fixed; top: 10px; right: 14px;
      height: 40px; z-index: 20; pointer-events: none;
    }
    #reload-btn {
      position: fixed; top: 14px; left: 14px; z-index: 30;
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,.9); box-shadow: 0 2px 8px rgba(0,0,0,.12);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #7a8a99; font-size: 20px;
      touch-action: manipulation; transition: background .15s ease;
    }
    #reload-btn:active { background: #dbe9f5; }
    #feedback-count-wrap {
      position: fixed; bottom: 14px; left: 14px; z-index: 30;
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,.92); border-radius: 999px;
      padding: 6px 14px 6px 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      font-size: 13px; color: #5a6b7c; font-weight: 600; white-space: nowrap;
    }

    /* ── Rating card (screen 1) ─────────────────────────────── */
    #screen-rating {
      background: #fff; border-radius: 28px;
      box-shadow: 0 12px 32px rgba(20,60,100,.22);
      padding: 4vh 4vw 3vh;
      display: flex; flex-direction: column; align-items: center;
      width: min(95vw, 900px);
    }
    #screen-rating h1 {
      font-size: clamp(22px, 3.8vw, 40px);
      color: #123a5c; font-weight: 700; text-align: center; margin-bottom: 6px;
    }
    #screen-rating .subtitle {
      font-size: clamp(14px, 1.8vw, 19px);
      color: #5a6b7c; text-align: center; margin-bottom: 3vh;
    }
    .rating-row {
      display: flex; flex-wrap: nowrap;
      justify-content: center; align-items: center;
      gap: clamp(20px, 5vw, 64px); margin-bottom: 3vh;
    }
    .emoji-btn {
      border: none; background: transparent; cursor: pointer;
      width: clamp(120px, 22vw, 240px);
      height: clamp(120px, 22vw, 240px);
      border-radius: 50%; padding: 10px;
      transition: transform .15s ease, background-color .15s ease;
      touch-action: manipulation;
    }
    .emoji-btn img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    .emoji-btn:active { transform: scale(1.1); background-color: #cfe6fb; }
    .emoji-btn.picked { transform: scale(1.18); background-color: #007bff; }
    #screen-rating .hint {
      font-size: clamp(13px, 1.5vw, 17px); color: #7a8a99; text-align: center;
    }
    /* Meal badge shown on rating screen */
    #meal-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: #eef4fa; border-radius: 999px; padding: 5px 16px;
      font-size: 14px; font-weight: 700; color: #007bff;
      margin-bottom: 10px;
    }

    /* ── Selection screens (liked / reasons) ────────────────── */
    .sel-screen {
      display: none; flex-direction: column;
      width: 100%; height: 100%;
      padding: 62px 120px 16px;           /* side padding leaves room for fixed buttons */
      animation: fadeIn .22s ease;
    }
    .sel-screen.active { display: flex; }
    .sel-screen h1 {
      font-size: clamp(20px, 3.2vw, 32px);
      color: #fff; font-weight: 700; text-align: center; margin-bottom: 4px;
    }
    .sel-screen .subtitle {
      font-size: clamp(13px, 1.8vw, 18px);
      color: rgba(255,255,255,.85); text-align: center; margin-bottom: 14px;
    }

    /* White card containing the chips */
    .sel-card {
      background: #fff; border-radius: 18px;
      box-shadow: 0 6px 20px rgba(20,60,100,.14);
      padding: 16px 20px;
      flex: 1; min-height: 0;
      overflow: hidden;                   /* no scroll — everything must fit */
      display: flex; flex-direction: column; gap: 10px;
    }

    /* ── "What did you love/like?" — food items as big chips ── */
    #liked-grid {
      display: flex; flex-wrap: wrap;
      gap: 12px; align-content: center; justify-content: center;
      height: 100%; padding: 8px 0;
    }
    .food-chip {
      display: inline-flex; align-items: center; gap: 10px;
      border: 2.5px solid #c4d4e3; background: #f7fbff; color: #33475b;
      border-radius: 999px; padding: 12px 24px;
      font-size: clamp(16px, 2vw, 22px); font-weight: 600; cursor: pointer;
      transition: background .12s, border-color .12s, color .12s, transform .1s;
      touch-action: manipulation; white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,.06);
    }
    .food-chip:active { transform: scale(.96); }
    .food-chip .fc-check {
      width: 24px; height: 24px; border-radius: 50%;
      border: 2px solid #b9cbdc; background: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 13px; color: transparent;
      transition: background .12s, border-color .12s, color .12s;
    }
    .food-chip.on { background: #007bff; border-color: #007bff; color: #fff; transform: scale(1.04); }
    .food-chip.on .fc-check { background: rgba(255,255,255,.3); border-color: transparent; color: #fff; }

    /* ── "Help us improve" — food columns, reason chips inside ─ */
    #reason-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px; height: 100%; align-content: stretch;
    }
    .reason-col {
      background: #f7fbff; border-radius: 12px;
      border: 2px solid #eef3f8; padding: 10px 10px 12px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .reason-col.on { border-color: #007bff; background: #eaf5ff; }
    .reason-col-name {
      font-size: clamp(12px, 1.5vw, 15px); font-weight: 700;
      color: #123a5c; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .reason-chips { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
    .r-chip {
      border: 2px solid #c4d4e3; background: #fff; color: #33475b;
      border-radius: 999px; padding: 5px 10px;
      font-size: clamp(11px, 1.3vw, 13px); font-weight: 600; cursor: pointer;
      transition: background .12s, color .12s, border-color .12s;
      touch-action: manipulation; white-space: nowrap;
    }
    .r-chip:active { background: #e3f0fd; }
    .r-chip.on { background: #007bff; border-color: #007bff; color: #fff; }

    /* ── Fixed Skip (left) / Submit (right) buttons ─────────── */
    #global-skip, #submit-wrap {
      position: fixed; top: 50%; transform: translateY(-50%);
      z-index: 50; display: none;
    }
    #global-skip { left: 0; }
    #submit-wrap  { right: 0; }
    #global-skip.visible, #submit-wrap.visible { display: flex; }

    #global-skip {
      flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; width: 100px; min-height: 110px;
      background: #f0f4f8; border: none;
      border-radius: 0 18px 18px 0;
      box-shadow: 4px 0 12px rgba(0,0,0,.12);
      cursor: pointer; font-size: 18px; font-weight: 700; color: #6a7b8c;
      touch-action: manipulation; padding: 0 8px;
      transition: background .15s, transform .1s;
    }
    #global-skip:active { background: #dde4ec; transform: translateY(-50%) scale(.96); }
    .skip-cd { font-size: 26px; font-weight: 900; color: #ff9800; line-height: 1; }

    #submit-wrap {
      align-items: center; justify-content: center;
      width: 120px; min-height: 120px;
    }
    #global-submit {
      position: relative; width: 108px; height: 108px;
      border: none; border-radius: 50%;
      background: #007bff; color: #fff;
      font-size: 16px; font-weight: 700; cursor: pointer;
      touch-action: manipulation;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 2px;
      box-shadow: -4px 0 12px rgba(0,0,0,.15);
      transition: background .15s, transform .1s;
    }
    #global-submit:active { background: #005bab; transform: scale(.96); }
    .submit-cd { font-size: 12px; font-weight: 600; opacity: .85; line-height: 1; }
    .submit-ring {
      position: absolute; inset: -6px;
      width: calc(100% + 12px); height: calc(100% + 12px);
      transform: rotate(-90deg); pointer-events: none;
    }
    .submit-ring-track { fill: none; stroke: rgba(255,255,255,.2); stroke-width: 5; }
    .submit-ring-fill  {
      fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round;
      transition: stroke-dashoffset .95s linear;
    }

    /* ── Thank you ───────────────────────────────────────────── */
    #screen-thanks {
      display: none; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
    }
    #screen-thanks.active { display: flex; }
    #screen-thanks img { width: clamp(140px, 22vw, 220px); height: auto; margin-bottom: 20px; }
    #thanks-msg {
      font-size: clamp(24px, 4.5vw, 46px); font-weight: 700;
      color: #fff; max-width: 820px;
    }

    .app-footer {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
      font-size: 16px; font-weight: 600; color: #000;
      z-index: 20; white-space: nowrap; pointer-events: none;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    @media (max-width: 640px) {
      #screen-rating { padding: 28px 20px 24px; }
      .sel-screen { padding: 58px 88px 12px; }
      #global-skip { width: 80px; min-height: 90px; font-size: 15px; }
      .skip-cd { font-size: 20px; }
      #global-submit { width: 86px; height: 86px; font-size: 14px; }
      #submit-wrap { width: 96px; min-height: 96px; }
    }
  </style>
</head>
<body>
  <div id="ist-clock" class="ist-clock"></div>
  <button id="reload-btn" onclick="location.reload()" aria-label="Reload page">
    <i class="fas fa-rotate-right"></i>
  </button>
  <img id="app-logo" src="images/logo.jpg" alt="Hirotec logo">
  <a id="admin-link" href="ratingLogin.html" aria-label="Admin login"><i class="fas fa-user-gear"></i></a>
  <div id="feedback-count-wrap">
    <i class="fas fa-comment-dots" style="color:#007bff;font-size:16px;"></i>
    Today:&nbsp;<span id="feedback-count" style="font-size:18px;font-weight:800;color:#007bff;">0</span>
  </div>

  <!-- 1. RATING -->
  <div id="screen-rating">
    <div id="meal-badge">🍱 <span id="meal-badge-text">Lunch</span></div>
    <h1>How was your meal today?</h1>
    <p class="subtitle">Tap a smiley to rate</p>
    <div class="rating-row" id="rating-row"></div>
    <p class="hint">Your feedback helps us serve you better</p>
  </div>

  <!-- 2. LIKED (rating 5) -->
  <div id="screen-liked" class="sel-screen">
    <h1 id="liked-title">What did you love?</h1>
    <p class="subtitle">Tap the items you enjoyed</p>
    <div class="sel-card">
      <div id="liked-grid"></div>
    </div>
  </div>

  <!-- 3. REASONS (rating 1) -->
  <div id="screen-reasons" class="sel-screen">
    <h1>Help us improve</h1>
    <p class="subtitle">Tap the items that need attention</p>
    <div class="sel-card">
      <div id="reason-grid"></div>
    </div>
  </div>

  <!-- 4. THANK YOU -->
  <div id="screen-thanks">
    <img id="thanks-img" src="images/5.png" alt="">
    <p id="thanks-msg">Thank you for your feedback!</p>
  </div>

  <!-- Fixed side buttons (shown on selection screens) -->
  <button id="global-skip" aria-label="Skip">
    <span class="skip-cd" id="skip-cd">15</span>Skip
  </button>
  <div id="submit-wrap">
    <button id="global-submit" aria-label="Submit">
      Submit<span class="submit-cd" id="submit-cd">15s</span>
    </button>
    <!-- r=48 → circumference ≈ 301.6 -->
    <svg class="submit-ring" viewBox="0 0 108 108" aria-hidden="true">
      <circle class="submit-ring-track" cx="54" cy="54" r="48"/>
      <circle class="submit-ring-fill"  cx="54" cy="54" r="48"
              stroke-dasharray="301.6" stroke-dashoffset="301.6"
              id="ring-fill"/>
    </svg>
  </div>

  <script src="assets/js/supabase-sync.js"></script>
  <script>
    /* =============================================================
       Flow:
         Rating 5  → liked screen (optional, 15s auto-submit)
         Rating 3  → save rating-only → thank you directly
         Rating 1  → reasons screen (optional, 15s auto-submit)
       ============================================================= */

    const IDLE_SECS   = 15;
    const RING_CIRC   = 301.6;
    const REASONS_LIST = ['Salty', 'Too Spicy', 'Undercooked', 'Overcooked', 'Not Fresh', 'Too Oily'];

    let ratingValue   = null;
    let advancing     = false;
    let currentScreen = null;
    let idleInterval  = null;
    let idleSecsLeft  = IDLE_SECS;
    let todayCount    = 0;
    let completionAudioContext = null;

    // Elements
    const screenRating  = document.getElementById('screen-rating');
    const screenLiked   = document.getElementById('screen-liked');
    const screenReasons = document.getElementById('screen-reasons');
    const screenThanks  = document.getElementById('screen-thanks');
    const thanksImg     = document.getElementById('thanks-img');
    const thanksMsg     = document.getElementById('thanks-msg');
    const adminLink     = document.getElementById('admin-link');
    const likedGrid     = document.getElementById('liked-grid');
    const reasonGrid    = document.getElementById('reason-grid');
    const globalSkip    = document.getElementById('global-skip');
    const submitWrap    = document.getElementById('submit-wrap');
    const globalSubmit  = document.getElementById('global-submit');
    const skipCd        = document.getElementById('skip-cd');
    const submitCd      = document.getElementById('submit-cd');
    const ringFill      = document.getElementById('ring-fill');
    const feedbackCountEl = document.getElementById('feedback-count');

    const TIMED = ['screen-liked', 'screen-reasons'];

    /* ── IST date + meal type ────────────────────────────────── */
    function getISTDate() {
      return new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit'
      }).format(new Date());
    }

    // Returns 'lunch' between 11:00 and 18:29 IST, 'dinner' from 18:30 onwards
    // Before 11:00 also shows lunch (morning preview)
    function getCurrentMealType() {
      const parts = new Intl.DateTimeFormat('en-IN', {
        timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: false
      }).formatToParts(new Date());
      const h = parseInt(parts.find(p => p.type === 'hour').value);
      const m = parseInt(parts.find(p => p.type === 'minute').value);
      const totalMins = h * 60 + m;
      // dinner: 18:30 (1110 mins) onwards; lunch: everything else
      return totalMins >= 1110 ? 'dinner' : 'lunch';
    }

    // Schedule an auto-reload at the next meal boundary (11:00 or 18:30 IST)
    function scheduleNextReload() {
      const now = new Date();
      const parts = new Intl.DateTimeFormat('en-IN', {
        timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      }).formatToParts(now);
      const h = parseInt(parts.find(p => p.type === 'hour').value);
      const m = parseInt(parts.find(p => p.type === 'minute').value);
      const s = parseInt(parts.find(p => p.type === 'second').value);
      const todayMins = h * 60 + m;

      // Boundaries in minutes-since-midnight IST
      const boundaries = [11 * 60, 18 * 60 + 30];
      const secsNow = todayMins * 60 + s;

      let nextSecs = null;
      for (const b of boundaries) {
        if (b * 60 > secsNow) { nextSecs = b * 60 - secsNow; break; }
      }
      // If past all boundaries today, schedule for first boundary tomorrow
      if (nextSecs === null) nextSecs = (24 * 3600 - secsNow) + boundaries[0] * 60;

      setTimeout(() => location.reload(), nextSecs * 1000);
    }

    /* ── Screen management ───────────────────────────────────── */
    function showScreen(id) {
      [screenRating, screenLiked, screenReasons, screenThanks].forEach(el => {
        el.classList.remove('active');
        if (el.id === 'screen-rating') el.classList.toggle('hidden', id !== 'screen-rating');
      });
      if (id !== 'screen-rating') document.getElementById(id).classList.add('active');

      adminLink.classList.toggle('hidden', TIMED.includes(id));
      document.getElementById('app-logo').classList.toggle('hidden', id === 'screen-reasons');

      const timed = TIMED.includes(id);
      globalSkip.classList.toggle('visible', timed);
      submitWrap.classList.toggle('visible', timed);
      if (timed) { currentScreen = id; startIdle(id); }
      else        { stopIdle(); currentScreen = null; }
    }

    /* ── Idle timer ──────────────────────────────────────────── */
    function updateTimerUI(secs) {
      skipCd.textContent   = secs;
      submitCd.textContent = secs + 's';
      ringFill.style.strokeDashoffset = RING_CIRC * (secs / IDLE_SECS);
    }
    function startIdle(screenId) {
      stopIdle();
      idleSecsLeft = IDLE_SECS;
      updateTimerUI(idleSecsLeft);
      idleInterval = setInterval(() => {
        idleSecsLeft = Math.max(0, idleSecsLeft - 1);
        updateTimerUI(idleSecsLeft);
        if (idleSecsLeft <= 0) {
          stopIdle();
          screenId === 'screen-liked' ? submitLiked() : submitReasons();
        }
      }, 1000);
    }
    function stopIdle() {
      clearInterval(idleInterval); idleInterval = null;
    }
    // Any tap resets the countdown
    document.addEventListener('pointerdown', () => {
      if (currentScreen) startIdle(currentScreen);
    }, true);

    /* ── Rating buttons ──────────────────────────────────────── */
    const ratingRow = document.getElementById('rating-row');
    const SMILEYS = [{ v: 1, label: 'Bad' }, { v: 3, label: 'Neutral' }, { v: 5, label: 'Good' }];
    SMILEYS.forEach(({ v, label }) => {
      const btn = document.createElement('button');
      btn.className = 'emoji-btn';
      btn.setAttribute('aria-label', label);
      btn.innerHTML = `<img src="images/${v}.png" alt="${label}">`;
      btn.addEventListener('click', () => pickRating(v, btn));
      ratingRow.appendChild(btn);
    });

    function pickRating(v, btn) {
      if (advancing) return;
      advancing = true; ratingValue = v;
      primeAudio(); btn.classList.add('picked');
      setTimeout(() => {
        if (v === 5) {
          document.getElementById('liked-title').textContent = 'What did you love?';
          showScreen('screen-liked');
        } else if (v === 1) {
          showScreen('screen-reasons');
        } else {
          // Neutral (3) — save and go straight to thanks
          saveRatingOnly(); showThanks();
        }
      }, 500);
    }

    /* ── Skip / Submit buttons ───────────────────────────────── */
    globalSkip.addEventListener('click', () => {
      stopIdle(); saveRatingOnly(); showThanks();
    });
    globalSubmit.addEventListener('click', () => {
      stopIdle();
      currentScreen === 'screen-liked' ? submitLiked() : submitReasons();
    });

    /* ── Data saving ─────────────────────────────────────────── */
    function appendLocal(key, data) {
      const arr = JSON.parse(localStorage.getItem(key) || '[]');
      arr.push(data); localStorage.setItem(key, JSON.stringify(arr));
    }
    function cloudSafe(rows) {
      if (typeof cloudSaveFeedback === 'function') cloudSaveFeedback(rows);
    }
    function saveRatingOnly() {
      const date = getISTDate();
      appendLocal('canteenFeedback', { date, rating: ratingValue });
      cloudSafe([{ feedback_date: date, rating: ratingValue, feedback_type: 'rating_only' }]);
    }
    function saveLiked(items) {
      const date = getISTDate();
      appendLocal('canteenFeedback', { date, rating: ratingValue, goodFood: items });
      cloudSafe(items.map(food_item => ({
        feedback_date: date, rating: ratingValue, feedback_type: 'good_food', food_item
      })));
    }
    function saveReasons(reasons) {
      const date = getISTDate();
      appendLocal('canteenFeedback', { date, rating: ratingValue, reasons });
      cloudSafe(reasons.map(r => ({
        feedback_date: date, rating: ratingValue, feedback_type: 'reason',
        food_item: r.foodItem, reason: r.reason
      })));
    }

    /* ── Submit actions ──────────────────────────────────────── */
    function submitLiked() {
      const items = [...likedGrid.querySelectorAll('.food-chip.on')].map(c => c.dataset.item);
      items.length ? saveLiked(items) : saveRatingOnly();
      showThanks();
    }
    function submitReasons() {
      const picked = [];
      reasonGrid.querySelectorAll('.reason-col').forEach(col => {
        col.querySelectorAll('.r-chip.on').forEach(chip =>
          picked.push({ foodItem: col.dataset.food, reason: chip.dataset.reason }));
      });
      picked.length ? saveReasons(picked) : saveRatingOnly();
      showThanks();
    }

    /* ── Build food selection screens ────────────────────────── */
    function buildLikedGrid(items) {
      likedGrid.innerHTML = '';
      items.forEach(item => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'food-chip';
        chip.dataset.item = item;
        chip.innerHTML = `<span class="fc-check"><i class="fas fa-check"></i></span>${item}`;
        chip.addEventListener('click', () => chip.classList.toggle('on'));
        likedGrid.appendChild(chip);
      });
    }

    function buildReasonGrid(items) {
      reasonGrid.innerHTML = '';
      items.forEach(item => {
        const col = document.createElement('div');
        col.className = 'reason-col';
        col.dataset.food = item;
        const name = document.createElement('div');
        name.className = 'reason-col-name';
        name.textContent = item;
        const chips = document.createElement('div');
        chips.className = 'reason-chips';
        REASONS_LIST.forEach(r => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'r-chip';
          chip.dataset.reason = r;
          chip.textContent = r;
          chip.addEventListener('click', () => {
            chip.classList.toggle('on');
            col.classList.toggle('on', !!col.querySelector('.r-chip.on'));
          });
          chips.appendChild(chip);
        });
        col.appendChild(name);
        col.appendChild(chips);
        reasonGrid.appendChild(col);
      });
    }

    /* ── Thank you + reset ───────────────────────────────────── */
    function primeAudio() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!completionAudioContext) completionAudioContext = new Ctx();
      if (completionAudioContext.state === 'suspended') completionAudioContext.resume();
    }
    function playSound() {
      primeAudio();
      const ctx = completionAudioContext; if (!ctx) return;
      const now = ctx.currentTime;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
      gain.connect(ctx.destination);
      [659.25, 783.99].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        osc.type = 'sine'; osc.frequency.value = freq;
        osc.connect(gain);
        osc.start(now + i * 0.12); osc.stop(now + 0.5);
      });
    }

    function showThanks() {
      const msgs = {
        5: "Amazing! We're glad you enjoyed it. Thank you!",
        3: "Thanks! We'll keep improving.",
        1: "We apologize for the experience. We'll work on it. Thank you!"
      };
      thanksImg.src = `images/${ratingValue === 1 ? 2 : ratingValue}.png`;
      thanksMsg.textContent = msgs[ratingValue] || 'Thank you for your feedback!';
      playSound();
      incrementFeedbackCount();
      showScreen('screen-thanks');
      setTimeout(resetToRating, 3000);
    }

    function resetToRating() {
      stopIdle();
      ratingValue = null; advancing = false; currentScreen = null;
      document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('picked'));
      likedGrid.querySelectorAll('.food-chip.on').forEach(c => c.classList.remove('on'));
      reasonGrid.querySelectorAll('.r-chip.on').forEach(c => c.classList.remove('on'));
      reasonGrid.querySelectorAll('.reason-col.on').forEach(c => c.classList.remove('on'));
      showScreen('screen-rating');
    }

    /* ── Menu loading ────────────────────────────────────────── */
    async function getTodayMenuItems() {
      const today   = getISTDate();
      const meal    = getCurrentMealType();
      const cacheKey = `${today}_${meal}`;
      const cache   = JSON.parse(localStorage.getItem('dailyMenus') || '{}');

      // Update meal badge
      const badge = document.getElementById('meal-badge-text');
      if (badge) badge.textContent = meal.charAt(0).toUpperCase() + meal.slice(1);

      try {
        if (typeof cloudFetchDailyMenu === 'function') {
          const cloud = await cloudFetchDailyMenu(today, meal);
          if (cloud && cloud.length) {
            cache[cacheKey] = cloud;
            localStorage.setItem('dailyMenus', JSON.stringify(cache));
            return cloud;
          }
        }
      } catch (e) {}
      return cache[cacheKey] || [];
    }

    /* ── Feedback count ──────────────────────────────────────── */
    function incrementFeedbackCount() {
      todayCount++;
      feedbackCountEl.textContent = todayCount;
    }
    function initFeedbackCount() {
      const today = getISTDate();
      const local = JSON.parse(localStorage.getItem('canteenFeedback') || '[]');
      todayCount = local.filter(e => e.date === today).length;
      feedbackCountEl.textContent = todayCount;
      if (typeof cloudFetchFeedback === 'function') {
        cloudFetchFeedback().then(rows => {
          if (!rows) return;
          const cloud = rows.filter(r => r.feedback_date === today).length;
          if (cloud > todayCount) { todayCount = cloud; feedbackCountEl.textContent = todayCount; }
        }).catch(() => {});
      }
    }

    /* ── IST clock ───────────────────────────────────────────── */
    const istClock = document.getElementById('ist-clock');
    const istFmt = new Intl.DateTimeFormat('en-IN', {
      timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: true
    });
    const tickClock = () => istClock.textContent = istFmt.format(new Date());
    tickClock(); setInterval(tickClock, 1000);

    document.addEventListener('contextmenu', e => e.preventDefault());

    document.addEventListener('DOMContentLoaded', async () => {
      initFeedbackCount();
      scheduleNextReload();
      const items = await getTodayMenuItems();
      if (items.length) {
        buildLikedGrid(items);
        buildReasonGrid(items);
      }
    });
  </script>
